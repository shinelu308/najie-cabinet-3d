<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上海纳杰电气 · 高低压开关柜柜内三维模型</title>
<!-- 内联图标：省掉一次站点根目录 favicon.ico 的 404 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%231B4F9C'/%3E%3Ctext%20x='16'%20y='23'%20font-size='17'%20font-weight='700'%20fill='%23fff'%20text-anchor='middle'%20font-family='sans-serif'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --blue:#1B4F9C; --blue-d:#123A75; --blue-l:#E8EFF9;
    --ink:#1F2937; --ink2:#5B6675; --ink3:#8A94A3;
    --line:#D6DEE8; --panel:rgba(255,255,255,.95);
    --grabh:56px;            /* 移动端底部抽屉抓手条高度 */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#EDF1F6;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);-webkit-font-smoothing:antialiased}
  #c{display:block;width:100%;height:100%;touch-action:none}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}

  .brand{position:absolute;left:24px;top:22px;display:flex;align-items:center;gap:12px;
    pointer-events:none;user-select:none}
  .brand .mark{width:44px;height:44px;border-radius:9px;background:var(--blue);
    color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:600;letter-spacing:.5px}
  .brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.5px;color:var(--blue-d)}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--ink2);letter-spacing:.3px}
  .brand .rule{width:1px;height:34px;background:var(--line)}

  .panel{position:absolute;right:24px;top:22px;width:268px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;
    box-shadow:0 8px 26px rgba(24,52,92,.09);backdrop-filter:blur(6px);
    max-height:calc(100vh - 44px);display:flex;flex-direction:column;overflow:hidden}
  .pbody{padding:14px 16px;overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:#C6D3E2 transparent}
  .pbody::-webkit-scrollbar{width:6px}
  .pbody::-webkit-scrollbar-thumb{background:#C6D3E2;border-radius:3px}
  .pbody::-webkit-scrollbar-track{background:transparent}
  .grab{display:none}      /* 仅移动端出现：底部抽屉的抓手 */
  .mhint{display:none}     /* 仅移动端出现：触屏手势提示 */
  .panel h2{margin:0 0 11px;font-size:13px;font-weight:600;color:var(--blue-d);
    letter-spacing:.6px;display:flex;align-items:center;gap:7px}
  .panel h2::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--blue)}
  .sec{margin-bottom:10px}
  .sec:last-child{margin-bottom:0}
  .sec + .sec{border-top:1px solid #EDF1F6;padding-top:10px}
  .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .row .k{font-size:12px;color:var(--ink2)}
  .row .v{font-size:13px;font-weight:600;color:var(--blue-d);
    font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;
    background:#E2E9F2;outline:none;margin:0 0 9px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:var(--blue);cursor:pointer;border:2.5px solid #fff;
    box-shadow:0 1px 5px rgba(27,79,156,.4)}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button{font:inherit;font-size:12px;padding:8px 0;border:1px solid var(--line);
    background:#fff;color:var(--ink2);border-radius:8px;cursor:pointer;
    transition:.16s;font-weight:500}
  .seg button:hover{border-color:#A9C1E2;color:var(--blue)}
  .seg button.on{background:var(--blue);border-color:var(--blue);color:#fff;
    box-shadow:0 3px 10px rgba(27,79,156,.28)}
  .seg .sub{display:block;font-size:10px;opacity:.72;margin-top:1px;font-weight:400}
  .lodnote{margin:8px 0 0;font-size:11.5px;line-height:1.52;color:#6B7686;
    background:#F5F8FC;border:1px solid #E7EEF6;border-radius:7px;padding:6px 9px}
  .lodnote b{color:var(--blue-d);font-weight:600}
  .toggles{display:flex;flex-wrap:wrap;gap:6px 13px}
  .tg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
    cursor:pointer;user-select:none}
  .tg input{accent-color:var(--blue);width:14px;height:14px;cursor:pointer;margin:0}
  .reset{width:100%;margin-top:12px;font:inherit;font-size:12px;padding:8px;
    border:1px solid var(--line);background:#fff;color:var(--ink2);
    border-radius:8px;cursor:pointer;font-weight:500}
  .reset:hover{border-color:#A9C1E2;color:var(--blue)}

  .foot{position:absolute;left:24px;bottom:22px;display:flex;align-items:center;gap:16px}
  .stats{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:9px 14px;display:flex;gap:18px;box-shadow:0 6px 18px rgba(24,52,92,.07)}
  .stats div{font-size:12px;color:var(--ink2)}
  .stats b{color:var(--blue-d);font-weight:600;font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:var(--ink3);letter-spacing:.2px}

  .dim{font-size:12px;font-weight:600;color:var(--blue-d);white-space:nowrap;
    background:rgba(255,255,255,.9);padding:2px 7px;border-radius:5px;
    border:1px solid #C8D8EE;font-variant-numeric:tabular-nums}
  .tag{font-size:11.5px;color:#33445C;white-space:nowrap;
    background:rgba(255,255,255,.92);padding:2px 7px;border-radius:5px;
    border:1px solid #DDE5EF}
  .tag.guard{color:#7A4C06;background:rgba(255,247,232,.95);border-color:#E9C489;
    font-weight:500;font-variant-numeric:tabular-nums;
    white-space:normal;max-width:168px;line-height:1.34;text-align:center;padding:4px 8px}
  .tag.guard.warn{color:#8E2A12;background:rgba(255,241,237,.96);border-color:#F0B6A4}

  /* 爆炸分解标签（CSS2DRenderer 会覆写 transform，所以只能动 opacity） */
  #labels .tag{transition:opacity .25s}
  .extag{font-size:12px;font-weight:600;color:#123A75;white-space:nowrap;
    background:rgba(255,255,255,.95);padding:3px 9px;border-radius:6px;
    border:1px solid #C3D5EE;box-shadow:0 2px 10px rgba(24,52,92,.13);
    opacity:0;transition:opacity .35s}
  body.exploded #labels .extag{opacity:1}
  body.exploded #labels .tag{opacity:0}
  /* 抽屉升起时不显示 3D 引注：面板占掉半屏，剩下的可见带（横屏只有 150px 上下）
     再塞十几条标签必然糊到面板上。收起抽屉即恢复——这才是"看参数"和"看模型"的正确分工。 */
  #labels{transition:opacity .22s}
  body.sheet #labels{opacity:0}

  #boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:12px;background:#EDF1F6;z-index:20;transition:opacity .5s}
  #boot .sp{width:30px;height:30px;border:2.5px solid #CBD8E8;border-top-color:var(--blue);
    border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #boot p{font-size:13px;color:var(--ink2);margin:0}
  #boot.gone{opacity:0;pointer-events:none}

  /* ═════════════════════ 移动端适配 ═════════════════════
     思路：画布始终全屏（模型尽量大），参数面板变成底部抽屉 ——
     平时只露一条抓手，点开后才升起。取景由 JS 的 fitBias() 让出被遮住的区域。 */
  @media (max-width:860px){
    :root{--grabh:56px}

    /* 顶部品牌条：压成一行，去掉副标题 */
    .brand{left:12px;top:calc(10px + env(safe-area-inset-top));gap:9px}
    .brand .mark{width:34px;height:34px;border-radius:8px;font-size:15px}
    .brand h1{font-size:14px;letter-spacing:.2px}
    .brand p,.brand .rule,.brand .h1x{display:none}

    /* 统计条挪到右上角，只留最要紧的数字 */
    .foot{left:auto;right:12px;bottom:auto;top:calc(10px + env(safe-area-inset-top));gap:0}
    .stats{padding:6px 11px;gap:10px;border-radius:9px}
    .stats div{font-size:11px}
    .stats div:last-child{display:none}
    .hint{display:none}

    /* 面板 → 底部抽屉 */
    .panel{left:0;right:0;top:auto;bottom:0;width:auto;
      border-radius:16px 16px 0 0;border-left:0;border-right:0;border-bottom:0;
      max-height:calc(100vh - 92px);max-height:calc(100dvh - 92px);
      box-shadow:0 -8px 30px rgba(24,52,92,.16);
      padding-bottom:env(safe-area-inset-bottom);
      position:fixed;       /* 必须是 fixed：absolute 时 translateY 会把文档撑高，出现"滚动余量" */
      backdrop-filter:none;  /* 手机 GPU 上整屏模糊很贵，面板本身 95% 不透明，肉眼无差 */
      transform:translateY(calc(100% - var(--grabh)));
      transition:transform .34s cubic-bezier(.32,.72,0,1);
      will-change:transform}
    /* 升起时只占 44dvh，上面留 56% 给模型；否则"看参数"的片刻模型整块被盖住 */
    .panel.open{transform:translateY(0);max-height:44dvh}

    .grab{display:flex;align-items:center;justify-content:center;gap:8px;
      width:100%;height:var(--grabh);flex:0 0 auto;position:relative;
      font:inherit;font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--blue-d);
      background:none;border:0;cursor:pointer;
      -webkit-tap-highlight-color:transparent}
    .grab i{position:absolute;left:50%;top:8px;transform:translateX(-50%);
      width:38px;height:4px;border-radius:2px;background:#CBD6E4}
    .grab b{font-size:10px;color:var(--ink3);transition:transform .3s;font-weight:400}
    .panel.open .grab b{transform:rotate(180deg)}
    .grab::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:1px;
      background:#EDF1F6}

    .pbody{padding:12px 16px 16px}
    .mhint{display:block;margin:0 0 12px;font-size:11.5px;color:var(--ink3);text-align:center}

    /* 触屏友好：加大拇指与点击区 */
    .panel h2{font-size:14px;margin-bottom:12px}
    .sec{margin-bottom:12px}
    .sec + .sec{padding-top:12px}
    .row{margin-bottom:7px}
    .row .k{font-size:13px}
    .row .v{font-size:14px}
    input[type=range]{height:6px;border-radius:3px;margin-bottom:15px}
    input[type=range]::-webkit-slider-thumb{width:23px;height:23px;border-width:3px}
    .seg button{padding:11px 0;font-size:13px;border-radius:9px}
    .tg{font-size:13.5px;gap:9px;padding:0 2px;min-height:34px}
    .tg input{width:20px;height:20px}
    .toggles{gap:2px 16px}
    .reset{padding:12px;font-size:13.5px;border-radius:9px;margin-top:14px}
    .lodnote{font-size:12px;line-height:1.5;padding:8px 10px}

    /* 3D 引注在小屏上只留"安全净距"两个短签：375 宽的屏塞不下十几条引注，
       而尺寸 / 净距数字面板里都有（尺寸行 + #guardNote），信息不丢 */
    .dim{display:none}
    .tag{display:none}
    .tag.guard{display:block;font-size:10px;max-width:124px;padding:3px 6px;line-height:1.28}
    .extag{font-size:10.5px;padding:2px 7px;border-radius:5px;letter-spacing:-.1px}
    .extag .en{display:none}   /* 分解态零件名：小屏只留中文 */
  }

  /* 横屏手机：高度很矮，抽屉别占满 */
  @media (max-width:900px) and (orientation:landscape){
    :root{--grabh:44px}
    .panel{max-height:min(66vh,320px);max-height:min(66dvh,320px)}
    .panel.open{max-height:min(54dvh,290px)}
    .grab i{top:6px;width:34px;height:3px}
    .brand .mark{width:30px;height:30px;font-size:13px;border-radius:7px}
    .brand h1{font-size:13px}
    .mhint{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>

<div class="brand">
  <div class="mark">NJA</div>
  <div class="rule"></div>
  <div>
    <h1>高低压开关柜<span class="h1x"> · 柜内三维模型</span></h1>
    <p>上海纳杰电气 · 参数化生成 / 骨架 + 板件 + 一次回路 + 电缆接线</p>
  </div>
</div>

<div class="panel" id="panel">
 <button class="grab" id="grab" type="button" aria-expanded="false" aria-controls="panelBody">
   <i></i><span>模型参数</span><b>▾</b>
 </button>
 <div class="pbody" id="panelBody">
  <p class="mhint">单指旋转 · 双指缩放 / 平移</p>
  <h2>柜体尺寸参数</h2>
  <div class="sec">
    <div class="row"><span class="k">宽度 W</span><span class="v" id="vw">800 mm</span></div>
    <input type="range" id="rw" min="600" max="1400" step="50" value="800">
    <div class="row"><span class="k">深度 D</span><span class="v" id="vd">1000 mm</span></div>
    <input type="range" id="rd" min="700" max="1600" step="50" value="1000">
    <div class="row"><span class="k">高度 H</span><span class="v" id="vh">2200 mm</span></div>
    <input type="range" id="rh" min="1800" max="2600" step="50" value="2200">
  </div>

  <div class="sec">
    <h2 style="margin-bottom:10px">装配 · 分解</h2>
    <div class="seg" style="grid-template-columns:repeat(2,1fr)" id="explBtns">
      <button data-e="0" class="on">装配态</button>
      <button data-e="1">分解态</button>
    </div>
    <div class="row" style="margin-top:10px"><span class="k">爆炸分解</span><span class="v" id="vExpl">装配态</span></div>
    <input type="range" id="rExpl" min="0" max="100" step="1" value="0">
  </div>

  <div class="sec">
    <h2 style="margin-bottom:10px">柜体结构</h2>
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="tPart" checked>隔板</label>
      <label class="tg"><input type="checkbox" id="tDoors" checked>门板</label>
      <label class="tg"><input type="checkbox" id="tSides">侧板</label>
      <label class="tg"><input type="checkbox" id="tGuard" checked>安全净距</label>
    </div>
    <div class="row" style="margin-top:10px"><span class="k">门开合</span><span class="v" id="vDoor">开启 100%</span></div>
    <input type="range" id="rDoor" min="0" max="100" step="1" value="100">
    <div class="row"><span class="k">手车摇出</span><span class="v" id="vCar">0 mm</span></div>
    <input type="range" id="rCar" min="0" max="100" step="1" value="0">
    <p class="lodnote" id="guardNote" style="display:none"></p>
  </div>

  <div class="sec">
    <h2 style="margin-bottom:10px">模型精度 LOD</h2>
    <div class="seg" id="lod">
      <button data-lod="1">LOD 1<span class="sub">外形</span></button>
      <button data-lod="2" class="on">LOD 2<span class="sub">工程</span></button>
      <button data-lod="3">LOD 3<span class="sub">精细</span></button>
    </div>
    <p class="lodnote" id="lodNote"></p>
  </div>

  <div class="sec">
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="tPrimary" checked>一次元件</label>
      <label class="tg"><input type="checkbox" id="tCable" checked>电缆接线</label>
      <label class="tg"><input type="checkbox" id="tSecondary" checked>二次元件</label>
      <label class="tg"><input type="checkbox" id="tMount" checked>安装梁</label>
      <label class="tg"><input type="checkbox" id="tDim" checked>尺寸标注</label>
      <label class="tg"><input type="checkbox" id="tTag" checked>部件名称</label>
      <label class="tg"><input type="checkbox" id="tEdges" checked>钣金边线</label>
      <label class="tg"><input type="checkbox" id="tGrid" checked>地面网格</label>
      <label class="tg"><input type="checkbox" id="tSpin" checked>自动旋转</label>
    </div>
    <button class="reset" id="bReset">复位视角</button>
  </div>
 </div>
</div>

<div class="foot">
  <div class="stats">
    <div>网格 <b id="sMesh">—</b></div>
    <div>三角面 <b id="sTri">—</b></div>
    <div>顶点 <b id="sVert">—</b></div>
  </div>
  <div class="hint">拖拽旋转 · 滚轮缩放 · 右键平移 · 面板可开合柜门 / 摇出手车</div>
</div>

<div id="boot"><div class="sp"></div><p>正在生成骨架几何…</p></div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
let THREE, OrbitControls, CSS2DRenderer, CSS2DObject, RoomEnvironment;
try {
  THREE = await import('three');
  ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
  ({ CSS2DRenderer, CSS2DObject } = await import('three/addons/renderers/CSS2DRenderer.js'));
  ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
} catch (e) {
  document.getElementById('boot').innerHTML =
    '<p>三维引擎加载失败，请检查网络后刷新（需访问 cdn.jsdelivr.net）</p>';
  throw e;
}

const P = { W:0.80, D:1.00, H:2.20, lod:2, mount:true, dim:true,
            primary:true, cable:true, secondary:true,
            partition:true, doors:true, sides:false, guards:true,
            tag:true, edges:true, grid:true, doorOpen:1, carPos:0, explode:0 };
const SEC = { a:0.045, b:0.070, t:0.0035 };

const canvas = document.getElementById('c');
// 小屏（手机 / 竖屏窄窗）：关掉 MSAA、降阴影分辨率，换帧率；像素比仍保留 1.8 抗锯齿观感
const SMALL = Math.min(innerWidth, innerHeight) < 720;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !SMALL });
renderer.setPixelRatio(Math.min(devicePixelRatio, SMALL ? 1.8 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

// 环境光照（HDRI 等价物）：金属/镀锌面的"可信度"几乎全靠它 —— 没有环境的金属是死灰
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// 背景：竖向浅灰渐变，匹配工程出图的干净底
function gradientBG(){
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#F8FBFE'); g.addColorStop(0.52, '#EDF1F6'); g.addColorStop(1, '#DCE4EE');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = gradientBG();

const labelRenderer = new CSS2DRenderer({ element: document.getElementById('labels') });

const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.minDistance = 1.2;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.52;
controls.autoRotateSpeed = 0.85;

// ── 视口让位：移动端底部抽屉会遮住一条，取景要把它让出来 ──
const mqMobile = matchMedia('(max-width: 860px)');
let sheetOpen = false;
let lastBias = null;
const isMobile = () => mqMobile.matches;
// 让位比例 = 被抽屉遮住的屏高占比。收起时 ≈ 抓手高度，升起时 ≈ 抽屉高度。
// 逐帧读 getBoundingClientRect 会强制重排，所以只在 resize / 开合时算一次，其余走缓存。
let sheetBias = 0;
function computeBias(){
  if (!isMobile()){ sheetBias = 0; return; }
  const vh = Math.max(320, innerHeight);
  if (sheetOpen){
    const p = document.getElementById('panel');
    const h = p ? p.getBoundingClientRect().height : innerHeight * 0.44;
    sheetBias = Math.min(0.62, h / vh);           // 上限 62%，再往上模型就小得看不清了
    return;
  }
  const g = document.querySelector('.grab');
  sheetBias = Math.min(0.16, (g ? g.getBoundingClientRect().height : 56) / vh);
}
function fitBias(){ return sheetBias; }
// 注视点 = 模型中心 - 让位补偿；相机同步平移，视线方向不变（所以不会把视角"扭"掉）
function aimTarget(centerY){
  const fov = THREE.MathUtils.degToRad(camera.fov);
  const visH = 2 * camera.position.distanceTo(controls.target) * Math.tan(fov / 2);
  const want = centerY - fitBias() / 2 * visH;
  camera.position.y += want - controls.target.y;
  controls.target.y = want;
  controls.update();
}
function focusY(){ return P.H * (0.46 + 0.10 * P.explode); }

function frameSpan(){
  // 分解后整体包络变大，取景距离要跟着放大，否则零件会飞出画面
  const grow = 1 + P.explode * 0.70;
  return Math.max(P.H, P.D * 1.2, P.W * 1.2) * grow;
}

// 模型真实包络（装配态）—— 竖向取景用参数化包络就够，但横向必须用真实包络：
// 竖屏的横向 fov 只有竖向的约 0.46 倍，只按竖向定距模型会横向冲出画面。
// 量两份：零件本体 + 安全净距盒（后者在装配态可见，必须一起进框）。
let envParts = null, envGuards = null;   // build() / applyMotion() 里置空，下次用时重测
const _v3a = new THREE.Vector3(), _v3b = new THREE.Vector3();
function modelEnvBoxes(){
  if (envParts) return;
  const saved = EXPLODE.map(r => r.g.position.clone());
  EXPLODE.forEach(r => r.g.position.set(0, 0, 0));
  root.updateMatrixWorld(true);
  const bs = new THREE.Box3(), bg = new THREE.Box3();
  // userData.noStat 标记的是净距包络这类辅助体：统计要排除，但可见时应进取景预算
  root.traverse(o => {
    if (!o.isMesh) return;
    if (o.userData.noStat) bg.expandByObject(o);
    else bs.expandByObject(o);
  });
  EXPLODE.forEach((r, i) => r.g.position.copy(saved[i]));
  root.updateMatrixWorld(true);
  envParts = bs; envGuards = bg;
}
// 横向定距：逐角解"这个角恰好落在半宽 1/M 处"所需的相机距离 ——
//   d ≥ dz + |x| · M / tan(fovH/2)
// 这里的 dz 是透视项：离相机近的角（dz 小 / 为负）会被投影放大，只算平行投影的半跨度
// 会低估，竖屏下就会把模型压到画框边缘。只依赖视线方向，与 d 无关，不成循环。
const FIT_M = 1.26;
function fitDistH(box, right, fwd, tanH){
  if (!box || box.isEmpty()) return 0;
  const tx = controls.target.x, ty = controls.target.y, tz = controls.target.z;
  let need = 0;
  for (let i = 0; i < 8; i++){
    const rx = ((i & 1) ? box.max.x : box.min.x) - tx;
    const ry = ((i & 2) ? box.max.y : box.min.y) - ty;
    const rz = ((i & 4) ? box.max.z : box.min.z) - tz;
    const x = rx * right.x + ry * right.y + rz * right.z;
    const dz = rx * fwd.x + ry * fwd.y + rz * fwd.z;
    const v = dz + Math.abs(x) * FIT_M / tanH;
    if (v > need) need = v;
  }
  return need;
}
function dVert(){
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  // 可用高度只占视口的一部分时，等价于把取景范围放大（÷usable），模型才不会被抽屉切掉
  const usable = Math.max(0.42, 1 - fitBias());
  return (frameSpan() / (2 * Math.tan(fovV / 2))) * 1.58 / usable;
}
function dHoriz(){
  const fovV = THREE.MathUtils.degToRad(camera.fov);
  modelEnvBoxes();
  const fwd = _v3a.copy(controls.target).sub(camera.position);
  if (fwd.lengthSq() < 1e-10) fwd.set(-0.60, -0.40, -0.69);
  fwd.normalize();
  const right = _v3b.set(0, 1, 0).cross(fwd).normalize();      // right = up × fwd
  const tanH = Math.tan(fovV / 2) * camera.aspect;
  const g = (envGuards && !envGuards.isEmpty())
    ? Math.max(0, 1 - P.explode / 0.15) : 0;                  // 净距盒在分解态自动收起 → 预算同步淡出
  const dP = fitDistH(envParts, right, fwd, tanH);
  if (!P.guards || g <= 0) return dP;
  return dP + g * Math.max(0, fitDistH(envGuards, right, fwd, tanH) - dP);
}
function camDist(){
  // 横向单独兜一道：横屏 / 桌面端由 dVert 主导（取值不变），竖屏由 dHoriz 主导（救回出框）
  return Math.max(dVert(), dHoriz());
}
// 只沿当前视线方向重新定距（保留用户的旋转角度）
function refitDistance(){
  const dir = camera.position.clone().sub(controls.target).normalize();
  camera.position.copy(controls.target.clone().add(dir.multiplyScalar(camDist())));
  controls.update();
}
// 让位比例变了才重新定距，避免桌面端随手改窗口大小就把用户的缩放重置掉
function applyLayout(force){
  computeBias();
  const b = fitBias();
  if (!force && b === lastBias) return;
  lastBias = b;
  if (camera.position.lengthSq() < 1e-8) return;   // 初始化阶段相机还没定位，别动它
  const y = focusY();
  refitDistance();
  aimTarget(y);
}
function setView(){
  const dir = new THREE.Vector3(0.60, 0.40, 0.69).normalize();
  const y = focusY();
  controls.target.set(0, y, 0);
  camera.position.copy(controls.target.clone().add(dir.multiplyScalar(camDist())));
  controls.update();
  aimTarget(y);
}

const root = new THREE.Group();
const dimGroup = new THREE.Group();

let carGroup = null;
let guardGroup = null;
const doorPivots = [];

// ── 爆炸分解：每个零件组登记一个"分解方向 + 抛出距离"，纯变换、不重建几何 ──
const EXPLODE = [];
const G = {};
const dashMat = new THREE.LineDashedMaterial({ color:0x8794A4, dashSize:0.048, gapSize:0.034,
                                              transparent:true, opacity:0.95 });

function exGroup(dir, t, name, lo){
  const g = new THREE.Group();
  root.add(g);
  EXPLODE.push({ g, name, t, dir: new THREE.Vector3(dir[0], dir[1], dir[2]).normalize(),
                 lo: lo || null, leader:null, c0:null });
  return g;
}

function exLabel(g, text, off){
  const d = document.createElement('div');
  d.className = 'extag';
  // 中英拆成两个 span：小屏只显示中文（.extag .en{display:none}）。
  // 十几条引注在 375 宽上本来就挤，英文一去掉宽度立刻减半，标签墙就散开了。
  const m = /^(.*?)\s*\((.+)\)\s*$/.exec(text);
  d.innerHTML = m ? m[1] + '<span class="en"> (' + m[2] + ')</span>' : text;
  const o = new CSS2DObject(d);
  o.position.set(off[0], off[1], off[2]);
  g.add(o);
  return o;
}

// 引导虚线：从"装配态位置"指向"分解后的位置"，即零件的抛出轨迹
function buildLeaders(){
  clear(leaderGroup);
  // 关键：测量前先把所有零件归零。否则在"已分解"状态下重建（比如切 LOD、切板件开关）
  // 会把上一轮的抛出位移算进装配坐标，引导线起点整体漂移。
  EXPLODE.forEach(r => r.g.position.set(0, 0, 0));
  const box = new THREE.Box3();
  root.updateMatrixWorld(true);
  EXPLODE.forEach(r => {
    if (!r.t) return;
    box.setFromObject(r.g);
    if (box.isEmpty()) return;
    r.c0 = box.getCenter(new THREE.Vector3());
    // 标签默认贴在零件包络正上方；lo 是逐零件的微调量，用来错开中段密集区的标签
    const lo = r.lo || [0, 0, 0];
    exLabel(r.g, r.name, [r.c0.x + lo[0], box.max.y + 0.06 + lo[1], r.c0.z + lo[2]]);
    const geo = new THREE.BufferGeometry().setFromPoints([r.c0.clone(), r.c0.clone()]);
    const line = new THREE.Line(geo, dashMat);
    line.computeLineDistances();
    line.frustumCulled = false;
    leaderGroup.add(line);
    r.leader = line;
  });
  refreshExtagList();
}

function applyExplode(){
  const e = P.explode;
  EXPLODE.forEach(r => {
    r.g.position.copy(r.dir).multiplyScalar(r.t * e);
    if (!r.leader || !r.c0) return;
    const p = r.c0.clone().addScaledVector(r.dir, r.t * e);
    const attr = r.leader.geometry.attributes.position;
    attr.setXYZ(1, p.x, p.y, p.z);
    attr.needsUpdate = true;
    r.leader.computeLineDistances();
  });
  leaderGroup.visible = e > 0.02;
  applyDimVisibility();
  // 安全净距包络是"装配态"的校核工具，零件散开后满屏黄框只会碍事，自动收起
  if (guardGroup){
    const gv = P.guards && e < 0.15;
    guardGroup.visible = gv;
    guardGroup.traverse(o => { if (o.isCSS2DObject) o.visible = gv; });
  }
  // 分解后整体重心上移，把相机注视点跟着抬一点，构图才不会"上重下空"
  aimTarget(P.H * (0.46 + 0.10 * e));
  document.body.classList.toggle('exploded', e > 0.14);
}

// CSS2DRenderer 只认对象自身的 visible、不看父级 —— 尺寸标注必须逐个同步，否则
// 关掉 dimGroup 之后标注会"留在原地不走"
function applyDimVisibility(){
  const vis = P.explode < 0.30;
  dimGroup.visible = vis;
  dimGroup.traverse(o => { if (o.isCSS2DObject) o.visible = vis; });
}

// 分解态标签很多，密集区会互相压盖。CSS2DRenderer 每帧重写 transform，
// 所以这里在它渲染完之后，直接往 transform 后面追加 translateY 做贪心下推。
let extagEls = [];
function refreshExtagList(){
  extagEls = [...document.querySelectorAll('#labels .extag')];
}
function deoverlapExtags(){
  if (P.explode < 0.05) return;
  // CSS2DRenderer 是在首次渲染时才把元素挂进 DOM 的，所以列表要惰性刷新；
  // 重建（切 LOD / 切板件）后旧元素会被移除，用 isConnected 判定是否失效。
  if (!extagEls.length || !extagEls[0].isConnected) refreshExtagList();
  if (extagEls.length < 2) return;
  const items = [];
  for (const el of extagEls){
    if (el.style.display === 'none') continue;
    items.push({ el, r: el.getBoundingClientRect() });
  }
  items.sort((a, b) => a.r.top - b.r.top);
  for (let i = 0; i < items.length; i++){
    for (let j = i + 1; j < items.length; j++){
      const a = items[i].r, b = items[j].r;
      const ox = Math.min(a.right, b.right) - Math.max(a.left, b.left);
      const oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
      if (ox > 2 && oy > 2){
        const dy = (a.bottom - b.top) + 4;
        items[j].el.style.transform += ' translateY(' + dy.toFixed(1) + 'px)';
        items[j].r = items[j].el.getBoundingClientRect();
      }
    }
  }
}

// 标签横向兜底：CSS2DRenderer 把标签中心对到 3D 点上，靠近画框边缘的零件（分解态飞出去的
// 门板、柜侧的型钢标签）会被切掉一截。两趟走 —— 先一口气读完所有 rect（只触发一次重排），
// 再统一追加 translateX；每帧追加是安全的，因为 CSS2DRenderer 每帧会重写整个 transform。
let clampEls = [];
function clampLabels(){
  const cont = document.getElementById('labels');
  const n = cont.children.length;
  if (!n) return;
  if (clampEls.length !== n || !clampEls[0].isConnected) clampEls = [...cont.children];
  const vw = innerWidth, PAD = 4;
  const todo = [];
  for (const el of clampEls){
    if (el.style.display === 'none') continue;
    const r = el.getBoundingClientRect();
    if (r.width <= 0) continue;
    if (r.left < PAD) todo.push([el, PAD - r.left]);
    else if (r.right > vw - PAD) todo.push([el, vw - PAD - r.right]);
  }
  for (const [el, dx] of todo) el.style.transform += ' translateX(' + dx.toFixed(1) + 'px)';
}

function cProfile(a, b, t){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.lineTo(a, 0); s.lineTo(a, t); s.lineTo(t, t);
  s.lineTo(t, b - t); s.lineTo(a, b - t); s.lineTo(a, b); s.lineTo(0, b);
  s.closePath();
  return s;
}

function strut(len, axis, lod, a, b, t, mat){
  let g;
  if (lod === 1){
    g = axis === 'x' ? new THREE.BoxGeometry(len, b, a)
      : axis === 'y' ? new THREE.BoxGeometry(a, len, b)
      : new THREE.BoxGeometry(a, b, len);
  } else {
    g = new THREE.ExtrudeGeometry(cProfile(a, b, t), { depth: len, bevelEnabled: false, curveSegments: 1 });
    g.translate(-a / 2, -b / 2, -len / 2);
    if (axis === 'y') g.rotateX(-Math.PI / 2);
    else if (axis === 'x') g.rotateY(Math.PI / 2);
  }
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

// ── 板件的"轴向无关"小工具：同一套写法能生成 XY / XZ / ZY 三种朝向的板 ──
function axisBox(axis, w, h, t){
  return axis === 'z' ? new THREE.BoxGeometry(w, h, t)
       : axis === 'y' ? new THREE.BoxGeometry(w, t, h)
       : new THREE.BoxGeometry(t, h, w);
}
function axisPos(axis, u, v, d){
  return axis === 'z' ? new THREE.Vector3(u, v, d)
       : axis === 'y' ? new THREE.Vector3(u, d, v)
       : new THREE.Vector3(d, v, u);
}

// 折边板：平板 + 四边折边。有折边才像钣金件，纯 Box 一眼就是"积木"
function foldedPanel(w, h, t, hem, mat, axis){
  axis = axis || 'z';
  const g = new THREE.Group();
  const put = (A, B, C, u, v, d) => {
    const m = new THREE.Mesh(axisBox(axis, A, B, C), mat);
    m.position.copy(axisPos(axis, u, v, d));
    m.castShadow = true; m.receiveShadow = true;
    if (P.edges && P.lod >= 2) withEdges(m, 20);
    g.add(m);
    return m;
  };
  put(w, h, t, 0, 0, 0);                                        // 面板
  const hd = hem * 1.9, d = -hem / 2;
  put(w, hem, hd, 0,  h / 2 - hem / 2, d);                      // 上折边
  put(w, hem, hd, 0, -h / 2 + hem / 2, d);                      // 下折边
  put(hem, h - 2 * hem, hd, -w / 2 + hem / 2, 0, d);            // 左折边
  put(hem, h - 2 * hem, hd,  w / 2 - hem / 2, 0, d);            // 右折边
  return g;
}

// 通风百叶：暗色衬板 + n 片倾斜叶片 —— 门板/侧板上一放，钣金味立刻就出来了
function louver(w, h, n, axis){
  axis = axis || 'z';
  const g = new THREE.Group();
  const back = new THREE.Mesh(axisBox(axis, w, h, 0.0015), matBreakerDark);
  back.position.copy(axisPos(axis, 0, 0, -0.004));
  g.add(back);
  const gap = h / n;
  for (let i = 0; i < n; i++){
    const s = new THREE.Mesh(axisBox(axis, w * 0.94, gap * 0.60, 0.0075), matSteel);
    s.position.copy(axisPos(axis, 0, -h / 2 + gap * (i + 0.5), 0));
    if (axis === 'x') s.rotation.z = -0.42; else s.rotation.x = -0.42;
    s.castShadow = true; s.receiveShadow = true;
    if (P.edges && P.lod >= 2) withEdges(s, 20);
    g.add(s);
  }
  return g;
}

// 螺栓阵列：InstancedMesh，几十颗也只是一个 draw call
// arrange = 排列方向；face = 螺栓头朝向（'z' 朝前后 / 'x' 朝左右）
function boltRow(n, arrange, spacing, cx, cy, cz, face){
  const geo = new THREE.CylinderGeometry(0.0072, 0.0072, 0.013, 6);
  if (face === 'x') geo.rotateZ(Math.PI / 2); else geo.rotateX(Math.PI / 2);
  const inst = new THREE.InstancedMesh(geo, matBolt, n);
  inst.castShadow = true;
  const o = new THREE.Object3D();
  for (let i = 0; i < n; i++){
    const s = (i - (n - 1) / 2) * spacing;
    if (arrange === 'x') o.position.set(cx + s, cy, cz);
    else if (arrange === 'y') o.position.set(cx, cy + s, cz);
    else o.position.set(cx, cy, cz + s);
    o.updateMatrix();
    inst.setMatrixAt(i, o.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  return inst;
}

// 紧固孔阵列：板面上的暗色小圆片，读作"冲孔" —— 钣金件最容易被忽略、又最提真实感的细节
function holeRow(n, arrange, spacing, cx, cy, cz, face, r){
  const geo = new THREE.CylinderGeometry(r || 0.0055, r || 0.0055, 0.0026, 10);
  if (face === 'x') geo.rotateZ(Math.PI / 2); else geo.rotateX(Math.PI / 2);
  const inst = new THREE.InstancedMesh(geo, matShrink, n);
  const o = new THREE.Object3D();
  for (let i = 0; i < n; i++){
    const s = (i - (n - 1) / 2) * spacing;
    if (arrange === 'x') o.position.set(cx + s, cy, cz);
    else if (arrange === 'y') o.position.set(cx, cy + s, cz);
    else o.position.set(cx, cy, cz + s);
    o.updateMatrix();
    inst.setMatrixAt(i, o.matrix);
  }
  inst.instanceMatrix.needsUpdate = true;
  return inst;
}

function clear(g){
  while (g.children.length){
    const c = g.children.pop();
    c.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.isCSS2DObject && o.element?.parentNode) o.element.parentNode.removeChild(o.element);
    });
  }
}

function build(){
  clear(root); clear(dimGroup);
  EXPLODE.length = 0;
  envParts = null; envGuards = null;   // 零件重建了 → 取景包络必须重测
  const { W, D, H, lod } = P;
  const { a, b, t } = SEC;
  const xC = W / 2 - a / 2, zC = D / 2 - b / 2;
  const spanX = W - a, spanZ = D - b;

  // ── 分解单元登记：dir = 分解方向，t = 满爆时抛出的距离(m)，lo = 标签微调 ──
  // 排布思路对齐参考图：板件沿装配轴一字排开，内部元件按"取出方向"抛出
  G.frame = exGroup([0, 0, 0],       0,    '柜体骨架 (Frame)');
  G.top   = exGroup([0, 1, .06],     .72,  '顶板 (Top Plate)',      [0, .02, 0]);
  G.bot   = exGroup([0, -1, .06],    .58,  '底板 (Bottom Plate)',   [0, .02, 0]);
  G.sideR = exGroup([1, 0, .12],     .95,  '侧板 (Side Panel)',     [.04, .04, 0]);
  G.sideL = exGroup([-1, 0, .12],    .95,  '侧板 (Side Panel)',     [-.04, .04, 0]);
  G.part  = exGroup([.12, 0, -1],    .74,  '隔板 (Partition)',      [-.05, .02, 0]);
  G.mount = exGroup([0, .5, 1],      .50,  '安装梁 (Mounting Rail)',[-.08, .10, 0]);
  G.plate = exGroup([-.10, .22, -1], .86,  '安装板 (Mounting Plate)',[.02, .04, 0]);
  G.doorF = exGroup([-.42, 0, 1],   1.05,  '前柜门 (Front Door)',   [.04, .02, 0]);
  G.doorB = exGroup([.42, 0, -1],    .92,  '前后柜门 (Rear Door)',  [-.04, .02, 0]);
  G.bus   = exGroup([-.86, .36, .36], .80,  '母排 (Busbar)',         [0, .06, 0]);
  G.car   = exGroup([.30, 0, 1],     .78,  '断路器 (ACB/MCCB)',     [.06, .04, 0]);
  G.ct    = exGroup([0, -.38, -1],   .60,  '互感器 (CT)',           [-.16, -.18, 0]);
  G.cable = exGroup([.90, -.18, .30], .58, '电缆 (Cable)',          [.12, -.16, 0]);
  G.term  = exGroup([.95, -.45, .28], .52, '端子排 (Terminal)',      [0, -.24, 0]);
  G.meter = exGroup([0, 0, 1],       .66,  '仪表室 (Meter)',        [.10, .14, 0]);

  const ring = (y, mat) => {
    for (const s of [1, -1]){
      const mx = strut(spanX, 'x', lod, a, b, t, mat); mx.position.set(0, y, s * zC);
      if (P.edges && lod >= 2) withEdges(mx, 22); G.frame.add(mx);
      const mz = strut(spanZ, 'z', lod, a, b, t, mat); mz.position.set(s * xC, y, 0);
      if (P.edges && lod >= 2) withEdges(mz, 22); G.frame.add(mz);
    }
  };

  for (const sx of [1, -1]) for (const sz of [1, -1]){
    const col = strut(H, 'y', lod, a, b, t, matSteel);
    col.position.set(sx * xC, H / 2, sz * zC);
    if (P.edges && lod >= 2) withEdges(col, 22);
    G.frame.add(col);
  }

  const rings = lod === 1 ? [0, H]
    : lod === 2 ? [0, 0.10, H - 0.14, H]
    : [0, 0.10, H * 0.47, H - 0.14, H];
  rings.forEach((y, i) => ring(y, i === 0 ? matSteelDark : matSteel));

  // 顶板 / 底板（折边钣金）
  if (lod >= 2){
    const tp = foldedPanel(W - 0.004, D - 0.004, 0.004, 0.020, matZinc, 'y');
    tp.position.set(0, H + 0.040, 0); G.top.add(tp);
    const bp = foldedPanel(W - 0.004, D - 0.004, 0.004, 0.020, matZinc, 'y');
    bp.rotation.x = Math.PI;
    bp.position.set(0, 0.042, 0); G.bot.add(bp);
  }

  if (P.mount && lod >= 2){
    const ys = lod === 2 ? [0.42, 0.96, 1.50] : [0.42, 0.72, 1.02, 1.32, 1.62, 1.92];
    ys.forEach(y => {
      for (const s of [1, -1]){
        const m = strut(spanX, 'x', lod, a * 0.85, b * 0.72, t, matZinc);
        m.position.set(0, y, s * (zC - 0.115));
        if (P.edges && lod >= 2) withEdges(m, 22);
        G.mount.add(m);
      }
    });
  }

  if (lod === 3){
    for (const sz of [1, -1]){
      const mid = strut(H, 'y', lod, a * 0.75, b * 0.75, t, matSteel);
      mid.position.set(0, H / 2, sz * zC);
      withEdges(mid, 22);
      G.frame.add(mid);
    }
    for (const sx of [1, -1]) for (const sz of [1, -1]){
      const foot = new THREE.Mesh(new THREE.BoxGeometry(a * 2.6, 0.024, b * 2.2), matSteelDark);
      foot.position.set(sx * xC, 0.012, sz * zC);
      foot.castShadow = true; withEdges(foot, 20); G.frame.add(foot);

      for (const y of [0.135, H - 0.175]){
        const gus = new THREE.Mesh(new THREE.BoxGeometry(a * 2.2, 0.075, 0.008), matZinc);
        gus.position.set(sx * xC, y, sz * (zC + b / 2));
        gus.castShadow = true; G.frame.add(gus);
      }
    }
    for (const sx of [1, -1]) for (const sz of [1, -1]){
      const eye = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.012, 14), matSteelDark);
      eye.position.set(sx * xC, H + 0.052, sz * zC);
      eye.castShadow = true; G.frame.add(eye);
    }
  }

  carGroup = new THREE.Group();
  G.car.add(carGroup);
  guardGroup = new THREE.Group();
  G.frame.add(guardGroup);
  doorPivots.length = 0;

  buildShell();
  buildComponents();
  buildGuards();
  buildDims();
  buildLeaders();
  applyMotion();
  applyExplode();
  updateStats();
}

function applyMotion(){
  if (carGroup) carGroup.position.z = P.carPos * P.D * 0.62;
  doorPivots.forEach(d => { d.group.rotation.y = d.sign * d.max * P.doorOpen; });
  envParts = null; envGuards = null;   // 门开度 / 手车位置变了 → 包络跟着变
}

function lineBetween(p1, p2, group){
  const g = new THREE.BufferGeometry().setFromPoints([p1, p2]);
  group.add(new THREE.Line(g, matLine));
}

function dimLabel(text, pos){
  const d = document.createElement('div');
  d.className = 'dim';
  d.textContent = text;
  const o = new CSS2DObject(d);
  o.position.copy(pos);
  dimGroup.add(o);
}

function buildShell(){
  const { W, D, H, lod } = P;
  const xIn = W / 2 - SEC.a, zIn = D / 2 - SEC.b;
  const T = 0.004, hem = 0.016;
  const SM = (m) => lod === 1 ? matGhost : m;

  // ── 侧板 ──
  if (P.sides){
    const sh = H - 0.03, sd = D - 2 * SEC.b - 0.010;
    for (const s of [1, -1]){
      const tgt = s > 0 ? G.sideR : G.sideL;
      const sp = foldedPanel(sd, sh, T, hem, SM(matZinc), 'x');
      sp.position.set(s * (W / 2 - T / 2), H / 2, 0);
      tgt.add(sp);
      if (lod >= 2){
        const lv = louver(sd * 0.44, sh * 0.17, 7, 'x');
        lv.position.set(s * (W / 2 - T / 2 - 0.005), H * 0.30, 0);
        tgt.add(lv);
        const bx = s * (W / 2 - T - 0.004);
        tgt.add(boltRow(5, 'z', sd * 0.17, bx, H - 0.20, 0, 'x'));
        tgt.add(boltRow(5, 'z', sd * 0.17, bx, 0.20, 0, 'x'));
      }
    }
  }

  // ── 隔板（母线室 / 断路器室 / 电缆室）──
  if (P.partition){
    const pw = W - 2 * SEC.a - 0.012;
    const p1 = foldedPanel(pw, zIn * 0.94, T, hem, SM(matZinc), 'y');
    p1.position.set(0, H * 0.782, zIn * 0.50); G.part.add(p1);

    const p2 = foldedPanel(pw, zIn * 0.94, T, hem, SM(matZinc), 'y');
    p2.position.set(0, H * 0.462, -zIn * 0.48); G.part.add(p2);

    const p3 = foldedPanel(pw, H * 0.70, T, hem, SM(matZinc), 'z');
    p3.position.set(0, H * 0.435, -zIn + 0.075); G.part.add(p3);
  }

  // ── 安装板（设备安装基板，可拆卸）──
  if (P.mount && lod >= 2){
    const pw = W - 2 * SEC.a - 0.016, ph = H * 0.44;
    const mp = foldedPanel(pw, ph, T, hem, SM(matZinc), 'z');
    mp.position.set(0, H * 0.50, -zIn + T / 2 + 0.004);
    G.plate.add(mp);
    // 冲孔阵列：上下两排横孔 + 两侧竖排孔
    const hz = -zIn + 0.0095;
    [ph * 0.40, -ph * 0.40].forEach(dy => {
      G.plate.add(holeRow(9, 'x', pw * 0.105, 0, H * 0.50 + dy, hz, 'z'));
    });
    [-1, 1].forEach(sx => {
      G.plate.add(holeRow(5, 'y', ph * 0.145, sx * pw * 0.42, H * 0.50, hz, 'z'));
    });
  }

  // ── 柜门 ──
  if (P.doors){
    const dw = W - 2 * SEC.a - 0.008;
    const leaf = (y0, y1, zPos, side, hingeX, outZ, target, opts) => {
      const hh = (y1 - y0) * H, cy = (y0 + y1) / 2 * H;
      const g = new THREE.Group();
      g.position.set(hingeX, cy, zPos);
      target.add(g);

      const pan = foldedPanel(dw, hh, T, hem, SM(matZinc), 'z');
      pan.position.set(side * dw / 2, 0, 0);
      g.add(pan);

      if (lod >= 2){
        if (opts.window){
          const fr = new THREE.Mesh(new THREE.BoxGeometry(dw * 0.36, hh * 0.215, T * 0.9), matZinc);
          fr.position.set(side * dw * 0.38, hh * 0.21, outZ * 0.003);
          g.add(fr);
          const win = new THREE.Mesh(new THREE.BoxGeometry(dw * 0.32, hh * 0.18, T * 0.6), matGlass);
          win.position.set(side * dw * 0.38, hh * 0.21, outZ * 0.006);
          g.add(win);
        }
        if (opts.vent){
          const lv = louver(dw * 0.30, hh * 0.20, 7, 'z');
          lv.position.set(-side * dw * 0.30, -hh * 0.20, 0.004);
          g.add(lv);
        }
      }

      // 把手
      const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.11, 10), SM(matBreakerDark));
      handle.position.set(side * dw * 0.88, 0, outZ * 0.022);
      handle.rotation.z = Math.PI / 2;
      handle.castShadow = true;
      g.add(handle);

      if (lod >= 2){
        // 铰链（三个，落在铰链侧门边）
        for (const hy of [-hh * 0.40, 0, hh * 0.40]){
          const hg = new THREE.Mesh(new THREE.CylinderGeometry(0.0095, 0.0095, 0.062, 10), matBolt);
          hg.position.set(side * 0.007, hy, 0);
          hg.castShadow = true;
          g.add(hg);
        }
        // 门边螺栓列（把手侧 + 铰链侧）
        const bz = outZ * 0.010;
        g.add(boltRow(7, 'y', hh * 0.115, side * dw * 0.925, 0, bz, 'z'));
        g.add(boltRow(7, 'y', hh * 0.115, side * dw * 0.075, 0, bz, 'z'));
      }

      doorPivots.push({ group: g, sign: -1, max: 1.74 });
      return g;
    };
    leaf(0.055, 0.965, zIn + T / 2, 1, -xIn, 1, G.doorF, { window:true });
    leaf(0.055, 0.455, -zIn - T / 2, -1, xIn, -1, G.doorB, { vent:true });

    // 后上封板
    const backPlate = foldedPanel(dw, H * 0.49, T, hem, SM(matZinc), 'z');
    backPlate.position.set(0, H * 0.725, -zIn - T / 2);
    G.doorB.add(backPlate);
  }
}

function buildGuards(){
  if (!P.guards){
    const gn0 = document.getElementById('guardNote');
    if (gn0) gn0.style.display = 'none';
    return;
  }
  const { W, D, H } = P;
  const zIn = D / 2 - SEC.b;
  const fog = new THREE.MeshBasicMaterial({ color:0xEF9F27, transparent:true, opacity:0.055,
                                            depthWrite:false, side:THREE.DoubleSide });
  const edge = new THREE.LineBasicMaterial({ color:0xBA7517, transparent:true, opacity:0.52 });

  const cage = (w, h, d, x, y, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), fog);
    m.position.set(x, y, z);
    m.userData.noStat = true;
    guardGroup.add(m);
    const l = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, d)), edge);
    l.position.set(x, y, z);
    l.userData.noStat = true;
    guardGroup.add(l);
  };
  const tag = (txt, x, y, z, warn, tip) => {
    const d = document.createElement('div');
    d.className = 'tag guard' + (warn ? ' warn' : '');
    d.textContent = txt;
    if (tip) d.title = tip;
    const o = new CSS2DObject(d);
    o.position.set(x, y, z);
    guardGroup.add(o);
  };

  const passD = 0.80, passReq = 0.80;
  cage(W, H * 0.94, passD, 0, H * 0.47, zIn + passD / 2);
  tag('柜前通道 ' + Math.round(passD * 1000) + ' mm ' + (passD >= passReq ? '✓' : '⚠'),
      -W / 2, H * 0.93, zIn + passD * 0.5, passD < passReq,
      '柜前维护通道 实测 ' + Math.round(passD * 1000) + ' mm，要求 ≥' + Math.round(passReq * 1000) + ' mm');

  const bw = Math.min(W * 0.62, 0.52), bh = H * 0.185, carD = 0.70;
  cage(bw * 1.14, bh * 1.85, carD, 0, H * 0.50, zIn + carD / 2);
  tag('手车抽出空间 ' + Math.round(carD * 1000) + ' mm', 0, H * 0.50 + bh * 1.12, zIn + carD / 2);

  const gx = -(W - 2 * SEC.a - 0.20) / 2 - 0.05;
  const gz = -zIn + 0.17;
  const pitch = 0.082, bar = 0.012;
  const gap = pitch - bar, req = 0.100;
  for (const dy of [0, -pitch]){
    const tick = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(gx - 0.03, H * 0.855 + dy, gz),
      new THREE.Vector3(gx + 0.03, H * 0.855 + dy, gz)
    ]), edge);
    tick.userData.noStat = true;
    guardGroup.add(tick);
  }
  const spanLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(gx, H * 0.855, gz),
    new THREE.Vector3(gx, H * 0.855 - pitch, gz)
  ]), edge);
  spanLine.userData.noStat = true;
  guardGroup.add(spanLine);
  const gOk = gap >= req;
  tag('母排净距 ' + Math.round(gap * 1000) + ' mm ' + (gOk ? '✓' : '⚠'),
      gx - 0.08, H * 0.855 - pitch / 2, gz, !gOk,
      '三相母排相间净距 实测 ' + Math.round(gap * 1000) + ' mm，要求 ≥' + Math.round(req * 1000) + ' mm');

  // 校核基准写入面板固定图例（3D 内只留短数字，避免旋转视角下标签相互压盖）
  const gn = document.getElementById('guardNote');
  gn.style.display = 'block';
  gn.innerHTML = '<b>安全净距校核</b>（12 kV 基准）<br>' +
    '柜前通道 ' + Math.round(passD * 1000) + ' / ≥' + Math.round(passReq * 1000) + ' mm ' +
    (passD >= passReq ? '✓' : '⚠') + '　母排相间 ' + Math.round(gap * 1000) + ' / ≥' +
    Math.round(req * 1000) + ' mm ' + (gOk ? '✓' : '⚠');
}

function rebuildGuards(){
  if (!guardGroup) return;
  clear(guardGroup);
  buildGuards();
  envParts = null; envGuards = null;   // 净距盒重建了 → 取景预算重算
  applyExplode();   // 分解态下净距包络要跟着收起，别在这里把它又点亮
  refitDistance();
  updateStats();
}

function buildComponents(){
  const { W, D, H, lod } = P;
  const xIn = W / 2 - SEC.a, zIn = D / 2 - SEC.b;
  const ghost = lod === 1;

  const M = (m) => ghost ? matGhost : m;
  let TARGET = G.frame;
  const put = (mesh, edge) => {
    mesh.castShadow = true; mesh.receiveShadow = true;
    if (edge) withEdges(mesh, 24);
    TARGET.add(mesh); return mesh;
  };
  const box = (w, h, d, m) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(m));
  const cyl = (r, h, m, s) => new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, s || 16), M(m));

  // ─────────────── 母线室：主母排 ───────────────
  if (P.primary){
    const busLen = Math.max(0.32, W - 2 * SEC.a - 0.20);
    const busZ = -zIn + 0.17, busY = H * 0.855;
    TARGET = G.bus;
    // 铜母线本体 + 相色热缩套管：中段包裹、两端与接头处留出铜面 —— 与现场实物一致
    [[matPhaseA, 0.082], [matPhaseB, 0], [matPhaseC, -0.082]].forEach(([pm, dy]) => {
      const bar = box(busLen, 0.012, 0.05, matCopper);
      bar.position.set(0, busY + dy, busZ);
      put(bar, true);
      if (lod >= 2){
        const sl = box(busLen * 0.62, 0.0138, 0.0538, pm);
        sl.position.set(0, busY + dy, busZ); TARGET.add(sl);
        [1, -1].forEach(s => {
          const sk = box(busLen * 0.07, 0.0144, 0.0544, matShrink);
          sk.position.set(s * busLen * 0.45, busY + dy, busZ); TARGET.add(sk);
        });
        // 中间接头压板 + 两颗接头螺栓（落在铜面外露段）
        const jp = box(0.055, 0.004, 0.058, matLug);
        jp.position.set(busLen * 0.40, busY + dy + 0.008, busZ); put(jp, true);
        [1, -1].forEach(s => {
          const jb = cyl(0.0062, 0.016, matBolt, 6);
          jb.position.set(busLen * 0.40, busY + dy + 0.010, busZ + s * 0.018); TARGET.add(jb);
        });
      }
    });

    // 支柱绝缘子（留在柜体上）
    TARGET = G.frame;
    if (lod >= 2){
      [-0.19, 0, 0.19].forEach(x => {
        if (Math.abs(x) > xIn - 0.09) return;
        // 支撑托板：把绝缘子顶端顶到最低一相母排底面
        const brk = box(0.052, 0.012, 0.050, matLug);
        brk.position.set(x, busY - 0.094, busZ); put(brk, true);
        const ins = cyl(0.026, 0.105, matInsulator, 14);
        ins.position.set(x, busY - 0.155, busZ); put(ins);
        const flange = cyl(0.034, 0.010, matSteelDark, 14);
        flange.position.set(x, busY - 0.213, busZ); put(flange);
      });
    }

    // ─────────────── 断路器室：手车式断路器 ───────────────
    TARGET = carGroup;
    const bw = Math.min(W * 0.62, 0.52);
    const bh = H * 0.185, bd = Math.min(D * 0.40, 0.40);
    const by = H * 0.50, bz = zIn * 0.40;

    const chassis = box(bw, bh * 0.15, bd, matBreakerDark);
    chassis.position.set(0, by - bh * 0.44, bz); put(chassis, true);

    const body = box(bw, bh * 0.60, bd * 0.92, matBreaker);
    body.position.set(0, by, bz); put(body, true);

    if (!ghost){
      // 上/下接线端子罩
      [1, -1].forEach(s => {
        const sh = box(bw * 0.72, bh * 0.10, bd * 0.22, matBreakerDark);
        sh.position.set(0, by + s * bh * 0.36, bz - bd * 0.30); put(sh, true);
      });
      // 脱扣单元 + 操作手柄 + 铭牌 + 指示灯
      const trip = box(bw * 0.34, bh * 0.18, 0.012, matBreakerDark);
      trip.position.set(-bw * 0.14, by - bh * 0.06, bz + bd * 0.474); put(trip);
      const lever = box(0.032, 0.062, 0.016, matPanelBox);
      lever.position.set(bw * 0.26, by - bh * 0.05, bz + bd * 0.478); put(lever, true);
      const tag = box(bw * 0.30, 0.030, 0.004, matLug);
      tag.position.set(-bw * 0.14, by + bh * 0.16, bz + bd * 0.478); TARGET.add(tag);
      [-1, 1].forEach(k => {
        const lamp = cyl(0.015, 0.016, k > 0 ? matPhaseC : matPhaseB, 12);
        lamp.rotation.x = Math.PI / 2;
        lamp.position.set(k * bw * 0.21, by + bh * 0.10, bz + bd * 0.49); TARGET.add(lamp);
      });
      // 四角紧固螺栓
      [1, -1].forEach(sx => [1, -1].forEach(sy => {
        const bl = cyl(0.0060, 0.014, matBolt, 6);
        bl.rotation.x = Math.PI / 2;
        bl.position.set(sx * bw * 0.44, by + sy * bh * 0.28, bz + bd * 0.466);
        TARGET.add(bl);
      }));
    }

    const poleY = by + bh * 0.52;
    const tcZ = bz - bd * 0.5 - 0.055;          // 断路器室后壁 · 静触头盒中心
    if (lod >= 2){
      [-1, 0, 1].forEach(k => {
        const pole = cyl(bw * 0.085, bh * 0.44, matBreakerDark, 14);
        pole.position.set(k * bw * 0.30, poleY, bz); put(pole, true);
        const cap = cyl(bw * 0.105, 0.020, matCopper, 14);
        cap.position.set(k * bw * 0.30, by + bh * 0.75, bz); put(cap);
      });
      // 触臂：自极柱沿 −z 插入静触头盒
      [-1, 0, 1].forEach(k => {
        const arm = cyl(bw * 0.050, bz - tcZ - 0.02, matCopper, 12);
        arm.rotation.x = Math.PI / 2;
        arm.position.set(k * bw * 0.30, poleY, (bz + tcZ) / 2);
        put(arm);
      });
    }

    // 静触头盒：装于柜内后壁，与三相触臂一一对位 —— 手车摇出后留在柜内
    TARGET = G.frame;
    if (lod >= 2){
      const p2y = H * 0.462;                    // 下方水平隔板的标高，做支撑基准
      [-1, 0, 1].forEach(k => {
        const x = k * bw * 0.30;
        const tc = box(0.088, 0.105, 0.078, matInsulator);
        tc.position.set(x, poleY, tcZ); put(tc, true);
        if (lod >= 3){
          const cup = cyl(0.026, 0.030, matCopper, 12);
          cup.rotation.x = Math.PI / 2;
          cup.position.set(x, poleY, tcZ + 0.048); put(cup);
        }
        // 支撑绝缘子 + 托板：把触头盒落到隔板上，否则在分解视图里会"悬空"
        const insTop = poleY - 0.058, insBot = p2y + 0.006;
        const ins = cyl(0.020, insTop - insBot, matInsulator, 12);
        ins.position.set(x, (insTop + insBot) / 2, -0.012); put(ins);
        const seat = box(0.050, 0.010, 0.062, matInsulator);
        seat.position.set(x, insTop + 0.004, 0.006); put(seat, true);
      });
    }

    // 手车导轨：柜内实装段托住底盘车，柜前延长段（半透明）为演示滑出路径
    if (lod >= 2){
      const railY = by - bh * 0.44 - bh * 0.075 - 0.025;
      const rIn = -zIn + 0.12, rFace = zIn + 0.02, rOut = zIn + 0.70;
      [xIn - 0.055, -(xIn - 0.055)].forEach(rx => {
        const seg1 = box(0.048, 0.050, rFace - rIn, matZinc);
        seg1.position.set(rx, railY, (rIn + rFace) / 2); put(seg1, true);
        const seg2 = box(0.048, 0.050, rOut - rFace, matRailOut);
        seg2.position.set(rx, railY, (rFace + rOut) / 2); put(seg2, true);
      });
    }

    // ─────────────── 电流互感器 ───────────────
    TARGET = G.ct;
    const ctY = H * 0.285, ctZ = -zIn + 0.24;
    const ctR = Math.min(0.052, W * 0.07);
    [-1, 0, 1].forEach(k => {
      const cx0 = k * Math.min(W * 0.19, 0.16);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(ctR, ctR * 0.40, 8, 20), M(matInsulator));
      ring.rotation.x = Math.PI / 2;
      ring.position.set(cx0, ctY, ctZ); put(ring);
      if (lod >= 2){
        const foot = box(ctR * 1.5, 0.030, ctR * 0.9, matInsulator);
        foot.position.set(cx0, ctY - ctR * 0.58, ctZ - ctR * 0.35); put(foot, true);
        const st = box(0.030, 0.020, 0.020, matPanelBox);
        st.position.set(cx0 + ctR * 0.72, ctY + ctR * 0.55, ctZ - ctR * 0.5); put(st);
      }
    });

    // 接地铜排 / 避雷器（柜体件）
    TARGET = G.frame;
    const gnd = box(Math.max(0.30, W * 0.58), 0.010, 0.038, matCopper);
    gnd.position.set(0, H * 0.075, -zIn + 0.16); put(gnd, true);

    if (lod >= 3){
      [-1, 0, 1].forEach(k => {
        const mo = cyl(0.024, 0.11, matInsulator, 12);
        mo.position.set(k * Math.min(W * 0.20, 0.17), H * 0.155, -zIn + 0.245); put(mo);
        const cap = cyl(0.028, 0.012, matCopper, 12);
        cap.position.set(k * Math.min(W * 0.20, 0.17), H * 0.212, -zIn + 0.245); put(cap);
      });
    }
  }

  // ─────────────── 电力电缆 ───────────────
  if (P.cable){
    const cx = Math.min(W * 0.19, 0.16);
    const ctY = H * 0.285, ctZ = -zIn + 0.24;
    TARGET = G.cable;

    if (lod === 1){
      const blk = box(cx * 2 + 0.06, H * 0.30, 0.14, matGhost);
      blk.position.set(0, H * 0.19, -zIn + 0.22); put(blk);
    } else {
      const phases = [matPhaseC, matPhaseB, matPhaseA];
      const y0 = 0.115;
      [-1, 0, 1].forEach((k, i) => {
        const x = k * cx;
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(x, y0, -zIn + 0.33),
          new THREE.Vector3(x, 0.20, -zIn + 0.29),
          new THREE.Vector3(x, 0.40, -zIn + 0.26),
          new THREE.Vector3(x, ctY, ctZ),
          new THREE.Vector3(x, ctY + 0.20, ctZ - 0.01),
          new THREE.Vector3(x, ctY + 0.32, ctZ + 0.22)
        ]);
        put(new THREE.Mesh(new THREE.TubeGeometry(curve, 30, 0.019, 8, false), matCable));

        // 电缆热缩头（相色）→ 压接端子（铜鼻）→ 螺栓
        const head = cyl(0.0235, 0.060, phases[i], 14);
        head.position.set(x, y0 + 0.005, -zIn + 0.328); put(head);
        const barrel = cyl(0.0185, 0.034, matLug, 12);
        barrel.position.set(x, y0 - 0.040, -zIn + 0.328); put(barrel);
        const tongue = box(0.036, 0.009, 0.030, matLug);
        tongue.position.set(x, y0 - 0.062, -zIn + 0.336); put(tongue, true);
        const bolt = cyl(0.0060, 0.020, matBolt, 6);
        bolt.position.set(x, y0 - 0.070, -zIn + 0.336); TARGET.add(bolt);

        const boot = cyl(0.023, 0.045, matBreakerDark, 12);
        boot.position.set(x, ctY + 0.29, ctZ + 0.20); put(boot);
        // 电缆抱箍
        const clamp = new THREE.Mesh(new THREE.TorusGeometry(0.024, 0.006, 6, 12), matSteelDark);
        clamp.rotation.x = Math.PI / 2;
        clamp.position.set(x, 0.44, -zIn + 0.262); TARGET.add(clamp);
      });

      if (lod >= 3){
        [[-0.075, 0], [0.105, 0]].forEach(([dx]) => {
          const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(dx, 0.06, -zIn + 0.35),
            new THREE.Vector3(dx + 0.015, 0.30, -zIn + 0.31),
            new THREE.Vector3(dx + 0.030, 0.54, -zIn + 0.35),
            new THREE.Vector3(dx + 0.040, 0.74, -zIn + 0.41)
          ]);
          put(new THREE.Mesh(new THREE.TubeGeometry(curve, 22, 0.008, 6, false), matCable));
          // 二次线号管
          for (const yy of [0.22, 0.46]){
            const sl = cyl(0.011, 0.020, matTerm, 10);
            sl.position.set(dx + 0.012, yy, -zIn + 0.318); TARGET.add(sl);
          }
        });
      }
    }
  }

  // ─────────────── 端子排（DIN 导轨 + 模块化端子块）───────────────
  if (P.cable){
    TARGET = G.term;
    const tw = Math.max(0.26, W * 0.46);
    const ty = H * 0.195, tz = -zIn + 0.055;
    if (lod === 1){
      const blk = box(tw, 0.10, 0.070, matGhost);
      blk.position.set(0, ty, tz - 0.008); put(blk);
    } else {
      const n = 8, pitch = tw / (n + 0.6);
      [1, -1].forEach((r, ri) => {
        const ry = ty + r * 0.040;
        const rail = box(tw, 0.007, 0.032, matDin);
        rail.position.set(0, ry - 0.030, tz + 0.004); put(rail, true);
        for (let i = 0; i < n; i++){
          const blk = new THREE.Mesh(new THREE.BoxGeometry(pitch * 0.80, 0.054, 0.058),
                                     (i + ri) % 2 ? matTerm : matTermAlt);
          blk.position.set(-tw / 2 + (i + 0.8) * pitch, ry, tz - 0.006);
          blk.castShadow = true; blk.receiveShadow = true;
          withEdges(blk, 24);
          TARGET.add(blk);
          const sc = cyl(0.0055, 0.007, matBolt, 6);
          sc.position.set(blk.position.x, ry + 0.030, tz - 0.006);
          TARGET.add(sc);
        }
      });
      // 短接铜排：现场用裸铜排把同电位端子并起来，压在端子排前方
      const jmp = box(tw * 0.94, 0.010, 0.024, matCopper);
      jmp.position.set(0, ty - 0.058, tz + 0.026); put(jmp, true);
      const brk = box(tw * 1.05, 0.010, 0.092, matPanelBox);
      brk.position.set(0, ty - 0.090, tz - 0.006); put(brk, true);
      // 端子排标牌
      const lb = box(tw * 0.9, 0.014, 0.003, matTerm);
      lb.position.set(0, ty + 0.070, tz - 0.010); TARGET.add(lb);
    }
  }

  // ─────────────── 二次仪表室 ───────────────
  if (P.secondary && lod >= 2){
    TARGET = G.meter;
    const my = H * 0.855, mz = zIn - 0.085;
    const plate = box(Math.max(0.30, W * 0.44), 0.125, 0.012, matPanelBox);
    plate.position.set(0, my, mz - 0.014); put(plate, true);
    [-1, 0, 1].forEach(k => {
      const bezel = new THREE.Mesh(new THREE.TorusGeometry(0.037, 0.0055, 8, 22), matBreakerDark);
      bezel.position.set(k * 0.115, my, mz); put(bezel);
      const dial = cyl(0.034, 0.014, matGlass, 20);
      dial.rotation.x = Math.PI / 2;
      dial.position.set(k * 0.115, my, mz); put(dial);
      const needle = box(0.003, 0.026, 0.003, matPhaseC);
      needle.position.set(k * 0.115, my + 0.008, mz + 0.009);
      needle.rotation.z = -0.5;
      TARGET.add(needle);
    });
  }
}

function buildDims(){
  clear(dimGroup);
  const { W, D, H } = P;
  if (!P.dim && !P.tag) return;
  const mm = v => Math.round(v * 1000) + ' mm';
  const off = 0.20;

  if (P.dim){

  const zf = D / 2 + off, yf = 0.012;
  lineBetween(new THREE.Vector3(-W / 2, yf, zf), new THREE.Vector3(W / 2, yf, zf), dimGroup);
  lineBetween(new THREE.Vector3(-W / 2, yf, zf - 0.05), new THREE.Vector3(-W / 2, yf, zf + 0.05), dimGroup);
  lineBetween(new THREE.Vector3(W / 2, yf, zf - 0.05), new THREE.Vector3(W / 2, yf, zf + 0.05), dimGroup);
  dimLabel(mm(W), new THREE.Vector3(0, yf + 0.055, zf));

  const xr = W / 2 + off;
  lineBetween(new THREE.Vector3(xr, yf, -D / 2), new THREE.Vector3(xr, yf, D / 2), dimGroup);
  lineBetween(new THREE.Vector3(xr - 0.05, yf, -D / 2), new THREE.Vector3(xr + 0.05, yf, -D / 2), dimGroup);
  lineBetween(new THREE.Vector3(xr - 0.05, yf, D / 2), new THREE.Vector3(xr + 0.05, yf, D / 2), dimGroup);
  dimLabel(mm(D), new THREE.Vector3(xr, yf + 0.055, 0));

  const xl = -W / 2 - off, zl = D / 2 + 0.02;
  lineBetween(new THREE.Vector3(xl, 0, zl), new THREE.Vector3(xl, H, zl), dimGroup);
  lineBetween(new THREE.Vector3(xl - 0.05, 0, zl), new THREE.Vector3(xl + 0.05, 0, zl), dimGroup);
  lineBetween(new THREE.Vector3(xl - 0.05, H, zl), new THREE.Vector3(xl + 0.05, H, zl), dimGroup);
  dimLabel(mm(H), new THREE.Vector3(xl - 0.06, H / 2, zl));

  }

  if (!P.tag) return;
  const tags = [
    ['立柱 · C 型钢 ' + Math.round(SEC.a * 1000) + '×' + Math.round(SEC.b * 1000) + '×' + (SEC.t * 1000).toFixed(1),
      new THREE.Vector3(-W / 2 - 0.16, H * 0.68, D / 2 * 0.35)],
    ['顶框横梁', new THREE.Vector3(W * 0.18, H + 0.13, D / 2 * 0.6)],
    ['底框 / 基座', new THREE.Vector3(W * 0.28, 0.26, D / 2 + 0.10)]
  ];
  if (P.mount && P.lod >= 2) tags.push(['元件安装梁', new THREE.Vector3(-W * 0.30, 0.96, D / 2 + 0.09)]);
  if (P.lod === 3) tags.push(['加强竖梁', new THREE.Vector3(0.02, H * 0.32, D / 2 + 0.09)]);
  if (P.primary && P.lod >= 2){
    tags.push(['主母排 A/B/C', new THREE.Vector3(W * 0.22, H * 0.945, -D / 2 - 0.08)]);
    if (P.carPos > 0.05)
      tags.push(['静触头盒', new THREE.Vector3(-W * 0.30, H * 0.70, -D * 0.34)]);
    tags.push(['手车式断路器', new THREE.Vector3(W * 0.36, H * 0.58, D / 2 + 0.10)]);
    tags.push(['手车导轨', new THREE.Vector3(W * 0.34, 0.80, D / 2 + 0.02)]);
    tags.push(['电流互感器', new THREE.Vector3(W * 0.34, H * 0.245, D / 2 + 0.10)]);
  }
  if (P.cable && P.lod >= 2){
    tags.push(['电力电缆', new THREE.Vector3(-W * 0.36, H * 0.135, D / 2 + 0.10)]);
  }

  tags.forEach(([txt, pos]) => {
    const d = document.createElement('div');
    d.className = 'tag';
    d.textContent = txt;
    const o = new CSS2DObject(d);
    o.position.copy(pos);
    dimGroup.add(o);
  });

  // 注意：CSS2DRenderer 不看父级 visible，所以必须走 applyDimVisibility 逐个同步
  applyDimVisibility();
}

  2: '<b>LOD 2 工程</b> — 真实 C 型钢骨架 + 侧板 / 隔板 / 门板；手车式断路器、<br>静触头盒、手车导轨、电流互感器、三相母排、电力电缆与端子排。<br>可装配、可做带电净距与维护空间校核。',
  3: '<b>LOD 3 精细</b> — 追加二次仪表、避雷器、支柱绝缘子、备用控制电缆、<br>端子分片与柜底安装脚。可出加工与装配图。'

function updateStats(){
  let mesh = 0, tri = 0, vert = 0;
  root.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    if (o.userData.noStat) return;
    const inst = o.isInstancedMesh ? o.count : 1;
    const g = o.geometry;
    const nv = g.attributes.position ? g.attributes.position.count : 0;
    mesh += inst;
    vert += nv * inst;
    tri += (g.index ? g.index.count / 3 : nv / 3) * inst;
  });
  document.getElementById('sMesh').textContent = mesh;
  document.getElementById('sTri').textContent = Math.round(tri).toLocaleString();
  document.getElementById('sVert').textContent = vert.toLocaleString();
  document.getElementById('lodNote').innerHTML = LOD_NOTE[P.lod];
}

  const oldH = P.H;
  P.W = +rw.value / 1000; P.D = +rd.value / 1000; P.H = +rh.value / 1000;
  syncLabels();
  build();
  syncMotion();

function syncExpl(){
  vExplEl.textContent = P.explode < 0.02 ? '装配态'
    : P.explode > 0.98 ? '全分解' : Math.round(P.explode * 100) + '%';

function setExplode(v, animate){
  v = Math.max(0, Math.min(1, v));
  if (!animate){ explAnim = null; P.explode = v; applyExplode(); refitDistance(); syncExpl(); return; }
  explAnim = { from: P.explode, to: v, t0: performance.now(), dur: 950 };
}

explBtns.addEventListener('click', e => {
  const b = e.target.closest('button[data-e]');

                  env: () => { modelEnvBoxes(); return { parts: envParts, guards: envGuards }; } };
P.doorOpen = +rDoorEl.value / 100;
P.carPos = +rCarEl.value / 100;
syncLabels();
syncMotion();
syncExpl();
build();
resize();       // 包络已变成真实尺寸 → 用真实包络重算一次取景距离（含横向约束）

let first = true;
renderer.setAnimationLoop(() => {
  if (explAnim){
    const k = Math.min(1, (performance.now() - explAnim.t0) / explAnim.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
    P.explode = explAnim.from + (explAnim.to - explAnim.from) * e;
    applyExplode(); refitDistance(); syncExpl();
    if (k >= 1) explAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  deoverlapExtags();   // 必须在 CSS2DRenderer 之后，否则 transform 会被它覆盖掉
  clampLabels();       // 同理：标签贴到画框边上时兜一下，别被切掉
  if (first){
    first = false;
    const b = document.getElementById('boot');
    b.classList.add('gone');
    setTimeout(() => b.remove(), 550);
    window.__READY = true;
  }
});
</script>
</body>
</html>
