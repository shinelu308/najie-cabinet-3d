<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上海纳杰电气 · 高低压开关柜三维数字孪生</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b6df6'/%3E%3Ctext x='16' y='22' font-size='15' font-family='sans-serif' font-weight='bold' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* ---- 科技风(深色) 默认 ---- */
    --page:#0a0f18;
    --ink:#0b1220; --ink-2:#2a3547; --muted:#6b7889;
    --brand:#0b6df6; --brand-2:#38bdf8; --line:rgba(255,255,255,.12);
    --panel:rgba(11,18,32,.82); --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
    --txt:#fff; --txt-2:#c3cfe0; --txt-3:#b9c6d8; --txt-4:#a9b7c9; --txt-5:#e8eef7;
    --ctrl:rgba(255,255,255,.055); --ctrl-h:rgba(11,109,246,.22);
    --hair:rgba(255,255,255,.075); --track:rgba(255,255,255,.09);
    --topbg:linear-gradient(180deg,rgba(6,10,18,.92),rgba(6,10,18,.55) 65%,transparent);
    --shadow:0 12px 40px rgba(0,0,0,.5); --shadow-2:0 16px 48px rgba(0,0,0,.55);
    --tipbg:#0b1220; --tiptx:#e6edf7;
    --mono:"JetBrains Mono",Consolas,monospace;
    --sans:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  /* ---- 工程图(浅色) 皮肤 ---- */
  body.light{
    --page:#eef1f5;
    --ink:#0f172a; --muted:#64748b;
    --brand:#0b6df6; --brand-2:#38bdf8; --line:rgba(15,23,42,.13);
    --panel:rgba(255,255,255,.86);
    --txt:#0f172a; --txt-2:#334155; --txt-3:#475569; --txt-4:#475569; --txt-5:#1e293b;
    --ctrl:rgba(15,23,42,.05); --ctrl-h:rgba(11,109,246,.14);
    --hair:rgba(15,23,42,.09); --track:rgba(15,23,42,.1);
    --topbg:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.6) 65%,transparent);
    --shadow:0 12px 34px rgba(15,23,42,.14); --shadow-2:0 16px 44px rgba(15,23,42,.16);
    --tipbg:#0f172a; --tiptx:#f1f5f9;
  }
  html,body{height:100%;overflow:hidden;background:var(--page);font-family:var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block;outline:none}

  /* ---------- 顶栏 ---------- */
  .topbar{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;
    padding:0 20px;gap:16px;z-index:20;
    background:var(--topbg);
    pointer-events:none}
  .topbar>*{pointer-events:auto}
  .logo{display:flex;align-items:center;gap:11px;flex:none}
  .logo .mark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,#0b6df6,#38bdf8);font-weight:800;font-size:15px;letter-spacing:-.5px;
    box-shadow:0 4px 16px rgba(11,109,246,.45)}
  .logo .txt b{display:block;font-size:15px;letter-spacing:.02em;line-height:1.2}
  .logo .txt span{display:block;font-size:10px;color:var(--muted);letter-spacing:.16em;font-family:var(--mono)}
  .title{padding-left:16px;margin-left:4px;border-left:1px solid var(--line);line-height:1.3}
  .title h1{font-size:15px;font-weight:600;letter-spacing:.02em}
  .title p{font-size:11px;color:var(--muted);margin-top:2px}
  .spacer{flex:1}
  .stat{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-3);
    background:var(--ctrl);border:1px solid var(--line);padding:5px 10px;border-radius:7px;font-family:var(--mono)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);
    animation:pulse 2s infinite}
  .themebar{display:flex;align-items:center;gap:10px}
  .themebar .tbtn{height:34px;border-radius:9px}
  /* 激活态在浅色皮肤下统一用白字(品牌渐变底) */
  body.light .tbtn.on,body.light .dbtn.on,body.light .logo .mark{color:#fff}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- 左侧工具 ---------- */
  .tools{position:absolute;left:18px;top:50%;transform:translateY(-50%);z-index:20;
    display:flex;flex-direction:column;gap:7px;
    background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:14px;padding:9px;box-shadow:var(--shadow)}
  .tbtn{width:42px;height:42px;border:none;border-radius:10px;background:var(--ctrl);
    color:var(--txt-2);cursor:pointer;display:grid;place-items:center;transition:.18s;position:relative}
  .tbtn:hover{background:var(--ctrl-h);color:var(--txt);transform:translateY(-1px)}
  .tbtn.on{background:linear-gradient(135deg,#0b6df6,#38bdf8);color:var(--txt);
    box-shadow:0 4px 14px rgba(11,109,246,.5)}
  .tbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .tbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;top:50%;
    transform:translateY(-50%);white-space:nowrap;background:var(--tipbg);color:var(--tiptx);
    font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:99;pointer-events:none}
  .tsep{height:1px;background:var(--line);margin:2px 4px}

  /* ---------- 右侧信息卡 ---------- */
  .info{position:absolute;right:18px;top:80px;width:306px;max-height:calc(100vh - 180px);
    overflow-y:auto;overscroll-behavior:contain;
    background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow-2);
    z-index:20;opacity:0;transform:translateX(18px);pointer-events:none;transition:.28s cubic-bezier(.4,0,.2,1)}
  .info.show{opacity:1;transform:none;pointer-events:auto}
  .info::-webkit-scrollbar{width:5px}
  .info::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
  .ih{padding:15px 17px 13px;border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,rgba(11,109,246,.20),transparent 70%)}
  .ih .cat{display:inline-block;font-size:10px;font-family:var(--mono);letter-spacing:.1em;
    color:var(--brand-2);background:rgba(56,189,248,.13);padding:3px 8px;border-radius:5px;margin-bottom:8px}
  .ih h2{font-size:17px;font-weight:600;letter-spacing:.01em}
  .ih .en{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:3px}
  .ibody{padding:14px 17px 17px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
    border-bottom:1px dashed var(--hair);font-size:12.5px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);flex:none}
  .kv .v{text-align:right;color:var(--txt-5);font-weight:500}
  .kv .v.mono{font-family:var(--mono);font-size:12px}
  .desc{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
    font-size:12px;line-height:1.75;color:var(--txt-4)}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .tg{font-size:10.5px;padding:3px 8px;border-radius:5px;background:var(--ctrl);
    color:var(--txt-3);border:1px solid var(--line)}

  /* ---------- 底部 ---------- */
  .dock{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:20;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;
    background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);
    border-radius:13px;padding:8px;box-shadow:var(--shadow);max-width:calc(100vw - 36px)}
  .dbtn{border:none;background:var(--ctrl);color:var(--txt-2);font-size:12.5px;
    padding:9px 15px;border-radius:9px;cursor:pointer;transition:.18s;font-family:var(--sans);
    display:flex;align-items:center;gap:7px;white-space:nowrap}
  .dbtn:hover{background:var(--ctrl-h);color:var(--txt)}
  .dbtn.on{background:linear-gradient(135deg,#0b6df6,#38bdf8);color:var(--txt);
    box-shadow:0 4px 14px rgba(11,109,246,.45)}
  .dbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .dsep{width:1px;height:24px;background:var(--line);margin:0 3px}
  .slider{display:flex;align-items:center;gap:9px;padding:0 11px;font-size:11.5px;color:var(--muted);
    font-family:var(--mono)}
  input[type=range]{-webkit-appearance:none;width:104px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
    border-radius:50%;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}

  /* ---------- 首屏引导 ---------- */
  .hint{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:15;
    font-size:11.5px;color:var(--muted);background:var(--panel);padding:7px 15px;
    border-radius:20px;border:1px solid var(--line);backdrop-filter:blur(8px);
    transition:.5s;font-family:var(--mono);letter-spacing:.03em}
  .hint.hide{opacity:0;transform:translateX(-50%) translateY(8px)}
  .load{position:absolute;inset:0;display:grid;place-items:center;z-index:60;
    background:var(--page);transition:.6s}
  .load.hide{opacity:0;pointer-events:none}
  .load .box{text-align:center}
  .load .ring{width:46px;height:46px;margin:0 auto 18px;border:2.5px solid var(--track);
    border-top-color:var(--brand);border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load p{font-size:12.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.06em}
  .load .bar{width:190px;height:2px;background:var(--track);border-radius:2px;
    margin:14px auto 0;overflow:hidden}
  .load .bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--brand),var(--brand-2));
    transition:width .3s}

  /* ---------- 三维标注标签 ---------- */
  .lbl{border-radius:6px;padding:5px 9px}
  .lbl-hv{background:rgba(8,14,24,.9);border:1px solid rgba(56,189,248,.4);
    border-left:2px solid #38bdf8;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .lbl-lv{background:rgba(8,14,24,.9);border:1px solid rgba(34,211,238,.4);
    border-left:2px solid #22d3ee;box-shadow:0 4px 14px rgba(0,0,0,.45)}
  .lbl-t{font-size:11px;font-weight:600;color:#eaf2fb;letter-spacing:.01em}
  .lbl-s{font-size:9px;color:#7f92a8;font-family:var(--mono);margin-top:1px}
  body.light .lbl-hv{background:rgba(255,255,255,.94);border-color:rgba(11,109,246,.45);
    border-left-color:#0b6df6;box-shadow:0 4px 14px rgba(15,23,42,.16)}
  body.light .lbl-lv{background:rgba(255,255,255,.94);border-color:rgba(8,145,178,.45);
    border-left-color:#0891b2;box-shadow:0 4px 14px rgba(15,23,42,.16)}
  body.light .lbl-t{color:#0f172a}
  body.light .lbl-s{color:#64748b}

  /* ---------- 响应式 ---------- */
  @media(max-width:860px){
    .title{display:none}
    .info{right:10px;left:10px;width:auto;top:auto;bottom:130px;max-height:44vh}
    .info.show{transform:none}
    .tools{left:10px;padding:7px;gap:5px}
    .tbtn{width:38px;height:38px}
    .dock{bottom:10px;padding:6px;gap:5px}
    .dbtn{padding:8px 11px;font-size:11.5px}
    .dbtn .lbl{display:none}
    .slider{padding:0 6px}
    input[type=range]{width:74px}
    .stat{display:none}
  }
  @media(max-width:560px){ .dbtn .lbl2{display:none} }

  /* ---------- 运行状态 HUD ---------- */
  .live{
    position:absolute;left:22px;bottom:22px;z-index:16;width:262px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);backdrop-filter:blur(14px);
    padding:13px 14px 11px;opacity:0;transform:translateY(10px);
    transition:opacity .32s cubic-bezier(.2,.8,.2,1),transform .32s cubic-bezier(.2,.8,.2,1);
    pointer-events:none;
  }
  .live.on{opacity:1;transform:none;pointer-events:auto;}
  .live .lh{display:flex;align-items:center;gap:7px;font:600 11px/1 var(--sans);
    color:var(--txt);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}
  .live .lh .pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:pulse 1.6s infinite;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}
    70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
  }
  .live .lh em{margin-left:auto;font-style:normal;font:600 10px/1 var(--mono);
    color:var(--ok);letter-spacing:.04em;}
  .live .lrow{display:flex;align-items:baseline;gap:8px;padding:5px 0;
    border-top:1px solid var(--hair);}
  .live .lrow:first-of-type{border-top:0;}
  .live .lrow span{font:400 11px/1.2 var(--sans);color:var(--muted);flex:0 0 66px;}
  .live .lrow b{font:600 12px/1.2 var(--mono);color:var(--txt);
    margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
  .live .lrow b.u{color:var(--brand-2);}
  .live .lbar{position:relative;height:4px;border-radius:2px;background:var(--track);
    overflow:hidden;margin-top:9px;}
  .live .lbar i{position:absolute;inset:0 auto 0 0;width:0%;border-radius:2px;
    background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .5s ease;}
  .live .lfoot{display:flex;justify-content:space-between;margin-top:6px;
    font:400 10px/1 var(--mono);color:var(--muted);letter-spacing:.03em;}
  .phases{display:flex;gap:5px;margin-top:10px;}
  .phases i{flex:1;height:26px;border-radius:6px;position:relative;overflow:hidden;
    background:var(--track);border:1px solid var(--hair);}
  .phases i s{position:absolute;left:0;right:0;bottom:0;height:30%;
    background:currentColor;opacity:.42;transition:height .45s ease;}
  .phases i:before{position:absolute;inset:0;z-index:2;display:flex;align-items:center;
    justify-content:center;font:600 9.5px/1 var(--mono);color:var(--txt);
    letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.55);content:attr(data-p);}
  @media(max-width:860px){ .live{display:none} }
</style>
</head>
<body>
<div id="app"></div>

<div class="load" id="loading"><div class="box">
  <div class="ring"></div>
  <p id="loadTxt">LOADING DIGITAL TWIN</p>
  <div class="bar"><i id="loadBar"></i></div>
</div></div>

<div class="topbar">
  <div class="logo">
    <div class="mark">NJA</div>
    <div class="txt"><b>上海纳杰电气</b><span>SHANGHAI NAJIE ELECTRIC</span></div>
  </div>
  <div class="title">
    <h1>高低压开关柜 · 三维数字孪生</h1>
    <p>KYN28-12 高压进线柜 &nbsp;|&nbsp; GGD 低压出线柜 &nbsp;·&nbsp; 800×1000×2200 mm</p>
  </div>
  <div class="spacer"></div>
  <div class="themebar">
    <button class="tbtn" data-act="theme" id="themeBtn" data-tip="切换皮肤" style="width:auto;padding:0 13px;gap:8px;display:flex;align-items:center">
      <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span id="themeLbl" style="font-size:12.5px;font-family:var(--sans)">工程图</span>
    </button>
    <div class="stat"><span class="dot"></span><span id="statTxt">SYSTEM ONLINE</span></div>
  </div>
</div>

<div class="tools">
  <button class="tbtn" data-act="reset" data-tip="复位视角">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg></button>
  <button class="tbtn" data-act="front" data-tip="正视">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg></button>
  <button class="tbtn" data-act="side" data-tip="侧视">
    <svg viewBox="0 0 24 24"><path d="M4 6l8-3 8 3v12l-8 3-8-3z"/><path d="M12 3v18"/></svg></button>
  <button class="tbtn" data-act="top" data-tip="俯视">
    <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
  <div class="tsep"></div>
  <button class="tbtn" data-act="label" data-tip="标注引线">
    <svg viewBox="0 0 24 24"><path d="M4 18h6"/><circle cx="13" cy="18" r="2.4"/><path d="M15.4 18H20"/><path d="M4 8h4"/><circle cx="10" cy="8" r="2.4"/><path d="M12.4 8H20"/></svg></button>
  <button class="tbtn" data-act="wire" data-tip="电流流动">
    <svg viewBox="0 0 24 24"><path d="M13 2L4.5 13H11l-1 9L19.5 11H13z"/></svg></button>
  <div class="tsep"></div>
  <button class="tbtn" data-act="full" data-tip="全屏">
    <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
</div>

<div class="info" id="info">
  <div class="ih">
    <span class="cat" id="iCat">COMPONENT</span>
    <h2 id="iName">—</h2>
    <div class="en" id="iEn">—</div>
  </div>
  <div class="ibody">
    <div id="iKv"></div>
    <div class="desc" id="iDesc"></div>
    <div class="tagrow" id="iTags"></div>
  </div>
</div>

<div class="hint" id="hint">拖拽旋转 · 滚轮缩放 · 点击元件查看详情</div>

<div class="dock">
  <button class="dbtn" data-act="explode">
    <svg viewBox="0 0 24 24"><path d="M12 2v6"/><path d="M12 16v6"/><path d="M2 12h6"/><path d="M16 12h6"/><circle cx="12" cy="12" r="3"/></svg>
    <span class="lbl">分解视图</span></button>
  <button class="dbtn" data-act="cutaway">
    <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 4l16 16"/><path d="M12 4v16"/></svg>
    <span class="lbl">剖切视图</span></button>
  <button class="dbtn on" data-act="door">
    <svg viewBox="0 0 24 24"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6"/><path d="M14 12h.01"/><path d="M3 5l4 7-4 7"/></svg>
    <span class="lbl">开关柜门</span></button>
  <div class="dsep"></div>
  <button class="dbtn" data-act="hv">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><path d="M9 7h6M9 11h6M9 15h3"/></svg>
    <span class="lbl">高压柜</span></button>
  <button class="dbtn" data-act="lv">
    <svg viewBox="0 0 24 24"><path d="M6 3h12v18H6z"/><circle cx="12" cy="9" r="2.6"/><path d="M9 16h6"/></svg>
    <span class="lbl">低压柜</span></button>
  <button class="dbtn" data-act="all">
    <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11z"/><path d="M9 20v-6h6v6"/></svg>
    <span class="lbl">全柜</span></button>
  <div class="dsep"></div>
  <button class="dbtn" data-act="live">
    <svg viewBox="0 0 24 24"><path d="M13 2 4.6 13.2H11l-1 8.8 8.4-11.2H12z"/></svg>
    <span class="lbl">通电运行</span></button>
  <div class="dsep"></div>
  <div class="slider"><span>分解度</span><input type="range" id="exRange" min="0" max="100" value="0"></div>
</div>

<div class="live" id="live">
  <div class="lh"><i class="pulse"></i>运行状态 <em id="liveState">RUNNING</em></div>
  <div class="lrow"><span>母线电压</span><b class="u" id="vBus">10.02 kV</b></div>

/* ==================== 场景 ==================== */

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// 主题参数(深色科技风 / 浅色工程图风)
const THEMES = {
  dark: {
    bg:0x0d1420, fogNear:14, fogFar:34,
    ground:0x111a26, groundRough:0.62, groundMetal:0.28,
    grid:0x2a3a4c, grid2:0x24303f, gridOpacity:0.42,
    hemiSky:0xdce8f7, hemiGround:0x2a3140, hemi:0.85,
    key:0xfff6ec, keyI:2.5, fill:0xc9dcff, fillI:1.05,
    rim:0x9fc4ff, rimI:1.5, topI:0.5,
    exposure:1.02, env:0.04,
  },
  light: {
    bg:0xf4f6f9, fogNear:22, fogFar:52,
    ground:0xe8ecf1, groundRough:0.92, groundMetal:0.0,
    grid:0xc2ccd8, grid2:0xd6dde5, gridOpacity:0.62,
    hemiSky:0xffffff, hemiGround:0xcbd4de, hemi:1.05,
    key:0xffffff, keyI:1.85, fill:0xeef4fb, fillI:0.72,
    rim:0xd6e0ec, rimI:0.75, topI:0.62,
    exposure:0.94, env:0.09,
  },
};
let themeName = 'dark';
const T = () => THEMES[themeName];

scene.background = new THREE.Color(T().bg);
scene.fog = new THREE.Fog(T().bg, T().fogNear, T().fogFar);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), T().env).texture;

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0.95, 1.75, 4.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 1.6;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ---------- 灯光 ---------- */
const hemi = new THREE.HemisphereLight(T().hemiSky, T().hemiGround, T().hemi);
scene.add(hemi);
const key = new THREE.DirectionalLight(T().key, T().keyI);
key.position.set(-4.5, 7.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 24;
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 6;  key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0016; key.shadow.normalBias = 0.022;
scene.add(key);
const fill = new THREE.DirectionalLight(T().fill, T().fillI); fill.position.set(6, 4, 3.5); scene.add(fill);
const rim  = new THREE.DirectionalLight(T().rim,  T().rimI);  rim.position.set(1.5, 4.5, -6.5); scene.add(rim);
const top  = new THREE.DirectionalLight(0xffffff, T().topI);  top.position.set(0, 8, 0.6); scene.add(top);

/* ---------- 地面 ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.MeshStandardMaterial({color:T().ground, roughness:T().groundRough, metalness:T().groundMetal})

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
// 网格线
let grid = new THREE.GridHelper(28, 56, T().grid, T().grid2);
grid.position.y = 0.002;
grid.material.transparent = true; grid.material.opacity = T().gridOpacity;
scene.add(grid);

/* ---------- 状态 ---------- */
const state = {
  explode: 0, explodeTarget: 0,
  doorOpen: 0, doorTarget: 0,
  wireFlow: false, showLabel: false, labelsVisible: false,
  focus: 'all', selectable: [], hv: null, lv: null,
  labels: [], highlight: null, highlightGroup: null, hover: null,
};

/* ==================== 载入模型 ==================== */
const loader = new GLTFLoader();
const loadBar = document.getElementById('loadBar');
const loadTxt = document.getElementById('loadTxt');

loader.load('assets/nja-cabinet.glb',
  g => {
    const root = g.scene;
    // 先计算整体包围盒并居中
    root.updateMatrixWorld(true);
    const bbox = new THREE.Box3().setFromObject(root);
    const ctr = bbox.getCenter(new THREE.Vector3());
    root.position.x -= ctr.x;
    root.position.z -= ctr.z;
    root.updateMatrixWorld(true);
    scene.add(root);
    window.__root = root;

    // 收集网格 + 记录分解基准(世界坐标)
    const hvC = new THREE.Vector3(-0.62, 1.15, 0), lvC = new THREE.Vector3(0.62, 1.15, 0);
    root.traverse(o => {
      if (!o.isMesh) return;
      o.castShadow = true; o.receiveShadow = true;
      if (o.material) {
        o.material.envMapIntensity = 0.75;
        if (o.material.metalness !== undefined)
          o.material.metalness = Math.min(o.material.metalness, 0.9);
      }
      const wp = new THREE.Vector3(); o.getWorldPosition(wp);
      const isHV = wp.x < 0;
      o.userData.owner = isHV ? 'hv' : 'lv';
      // glTF 导出时大量材质默认带 transparent 标记(实际 opacity=1),
      // 会干扰渲染排序; 这里显式归一化, 只让门保持半透明。
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(mm => {
        if (!mm) return;
        if (mm.opacity >= 1) { mm.transparent = false; mm.depthWrite = true; }
        mm.needsUpdate = true;
      });
      // 分解方向: 相对柜心向外, 但抑制 X 方向外扩(避免门/侧板飞出画面)
      const center = isHV ? hvC : lvC;
      const dir = wp.clone().sub(center);
      dir.x *= 0.25;                      // 压缩横向位移
      dir.z *= 1.0;
      const dist = dir.length();
      o.userData.explodeDir = dist > 1e-4 ? dir.normalize() : new THREE.Vector3(0, 1, 0);
      o.userData.explodeMag = Math.min(0.20, 0.045 + dist * 0.16);
      // 柜体框架/门框属于"固定骨架", 分解时留在原位(否则细长件会被推成散板)
      if (/(_doorFrame|_post|_sideL|_sideR|_back|_top$|_bot$|_base[FBLR])/.test(o.name)) {
        o.userData.explodeMag = 0;
      }
      o.userData.basePos = o.position.clone();   // 本地坐标基准
      o.userData.doorBase = o.position.clone();  // 门动画专用基准(与 basePos 同源)
      state.selectable.push(o);
    });

    buildLabels(root);
    buildWireFlow(root);
    collectDoorParts(root);
    makeDoorTranslucent();
    // 初始门状态 = 全开 90°
    state.doorOpen = 1; state.doorTarget = 1;
    state._dirty = true;
    finishLoading();
  },
  ev => {
    if (ev.total) {
      const p = Math.round(ev.loaded/ev.total*100);
      loadBar.style.width = p + '%';
      loadTxt.textContent = `LOADING DIGITAL TWIN  ${p}%`;
    }
  },
  err => {
    loadTxt.textContent = '模型加载失败，请检查 assets/nja-cabinet.glb';
    console.error(err);
  }
);

function finishLoading(){
  document.getElementById('loading').classList.add('hide');
  setTimeout(()=>document.getElementById('hint').classList.add('hide'), 5200);
}

    {k:'vcb_body', t:'真空断路器 VS1',   s:'12kV · 手车式'},
    {k:'hv_ct0', t:'电流互感器',            s:'穿心式 · 测量/保护'},
    {k:'lv_busH0', t:'低压主母排',          s:'0.4kV · 630–3150A'},
    {k:'acb_body', t:'框架断路器 ACB',   s:'智能脱扣 · 抽屉式'},
    {k:'lv_mcc_m0', t:'塑壳断路器 MCCB',    s:'分支保护 · 25–65kA'},
    {k:'lv_t1_rail', t:'接线端子排',        s:'阻燃 V-0'},
    {k:'lv_trL0', t:'电缆桥架',        s:'镀锌网格'},
    {k:'hv_arrester', t:'氧化锌避雷器',      s:'HY5WS · 过电压保护'},
  ];
  targets.forEach((tg, i) => {
    let obj = null;
    root.traverse(o => { if(!obj && o.name === tg.k) obj = o; });
    if (!obj) { // 模糊匹配
      root.traverse(o => { if(!obj && o.name && o.name.indexOf(tg.k) === 0) obj = o; });
    }
    if (!obj) return;
    const wp = new THREE.Vector3(); obj.getWorldPosition(wp);
    const isHV = wp.x < 0;
    const off = new THREE.Vector3(isHV ? -0.78 : 0.78, 0.16, 0.36);
    const end = wp.clone().add(off);

    const gline = new THREE.BufferGeometry().setFromPoints([wp.clone(), end]);
    const lc = isHV ? 0x38bdf8 : 0x22d3ee;
    const line = new THREE.Line(gline, new THREE.LineBasicMaterial({
      color: lc, transparent:true, opacity:0.9}));
    scene.add(line);

    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.019, 14, 14),
      new THREE.MeshBasicMaterial({color: lc}));
    dot.position.copy(wp); scene.add(dot);

    // HTML 标签 (配色用 CSS 变量, 随皮肤切换)
    const el = document.createElement('div');
    el.className = 'lbl' + (isHV ? ' lbl-hv' : ' lbl-lv');
    el.style.cssText = `position:absolute;transform:translate(-50%,-50%);pointer-events:none;
      backdrop-filter:blur(6px);opacity:0;transition:opacity .3s;white-space:nowrap;`;
    el.innerHTML = `<div class="lbl-t">${tg.t}</div>
      <div class="lbl-s">${tg.s}</div>`;
    document.body.appendChild(el);

    line.visible = false; dot.visible = false;   // 与 HTML 标签同步显隐
    state.labels.push({el, anchor:end, visible:false, line, dot, isHV});
  });
}

/* 主题切换时重染标注引线(浅底需要更深的蓝, 保证对比度) */
function retintLabels(name){
  const light = name === 'light';
  state.labels.forEach(l => {
    const hy = l.isHV ? (light ? 0x0b6df6 : 0x38bdf8) : (light ? 0x0891b2 : 0x22d3ee);
    if (l.line) l.line.material.color.setHex(hy);

/* ==================== 运行状态 · 电流流动 ==================== */
/* 相序: A(L1)黄 · B(L2)绿 · C(L3)红 · N 蓝 —— 与柜内母排热缩管同色 */
const PHASE = [
  {hex:0xeab308, w:1.00, nm:'L1'},
  {hex:0x22c55e, w:0.94, nm:'L2'},
  {hex:0xef4444, w:1.06, nm:'L3'},
  {hex:0x3b82f6, w:0.26, nm:'N' },
];
let flowGroup = null, flowMats = [], glowMats = [], lampMats = [];
let liveOn = false, liveAmt = 0, liveT = 0, hudT = 0;

function dashTexture(){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 16;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 256, 0);
  grd.addColorStop(0.00, 'rgba(255,255,255,0)');
  grd.addColorStop(0.30, 'rgba(255,255,255,0.72)');
  grd.addColorStop(0.44, 'rgba(255,255,255,1)');
  grd.addColorStop(0.58, 'rgba(255,255,255,0.72)');
  grd.addColorStop(1.00, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 256, 16);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}

function buildWireFlow(root){
  flowGroup = new THREE.Group();
  flowGroup.visible = false;
  flowGroup.renderOrder = 6;
  scene.add(flowGroup);
  window.__flow = flowGroup;

  /* ---- 1. 母排载流: 沿母排长轴贴一条滚动虚线光带 ---- */
  const bars = [];
  root.traverse(o => {
    if (o.isMesh && /^(hv_busH|lv_busH|lv_busV)\d$/.test(o.name)) bars.push(o);
  });
  bars.forEach(o => {
    const idx = Math.min(parseInt(o.name.slice(-1), 10) || 0, 3);
    const ph = PHASE[idx];
    const bb = new THREE.Box3().setFromObject(o);
    const sz = bb.getSize(new THREE.Vector3());
    const ctr = bb.getCenter(new THREE.Vector3());
    let a, b;
    if (sz.x >= sz.z) {
      a = new THREE.Vector3(bb.min.x, ctr.y, ctr.z);
      b = new THREE.Vector3(bb.max.x, ctr.y, ctr.z);
    } else {
      a = new THREE.Vector3(ctr.x, ctr.y, bb.min.z);
      b = new THREE.Vector3(ctr.x, ctr.y, bb.max.z);
    }
    const len = a.distanceTo(b);
    if (len < 0.04) return;
    const r = Math.max(0.005, Math.min(sz.y, sz.z) * 0.28);
    const geo = new THREE.TubeGeometry(new THREE.LineCurve3(a, b), 1, r, 6, false);
    const tex = dashTexture();
    tex.repeat.x = Math.max(1, Math.round(len / 0.17));
    const mat = new THREE.MeshBasicMaterial({
      map: tex, color: ph.hex, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    flowGroup.add(new THREE.Mesh(geo, mat));
    flowMats.push({mat, tex, speed: 0.34 * ph.w, off: Math.random() * 6.283});
  });

  /* ---- 2. 导线"带电"辉光 + 指示灯脉动 ---- */
  const seen = new Set();
  root.traverse(o => {
    if (!o.isMesh || !o.material) return;
    const ms = Array.isArray(o.material) ? o.material : [o.material];
    ms.forEach(m => {
      if (!m || seen.has(m.uuid)) return;
      seen.add(m.uuid);
      const nm = m.name || '';
      if (/^wire_/.test(nm) && m.emissive) {
        m.emissive.copy(m.color);
        m.emissiveIntensity = 0;
        glowMats.push({m, base: 0.10 + Math.random() * 0.07, off: Math.random() * 6.283});
      } else if (/^bus_[ygrb]$/.test(nm) && m.emissive) {
        // 母排通电后按相序自身微亮, 让"载流"一眼可读
        m.emissive.copy(m.color);
        m.emissiveIntensity = 0;
        glowMats.push({m, base: 0.30, off: Math.random() * 6.283, pole: true});
      } else if (/^(btn_g|btn_r|screen_l|screen)$/.test(nm) && m.emissive) {
        lampMats.push({m, base: Math.max(m.emissiveIntensity || 0, 0.9),
                       off: Math.random() * 6.283, sp: 1.3 + Math.random() * 1.5});
      }
    });
  });
  console.log('[twin] live: busbar belts =', flowMats.length,
              '| wire mats =', glowMats.length, '| lights =', lampMats.length);
}

/* ---- 通电 / 断电 ---- */
function setLive(on){
  liveOn = on;
  const el = document.getElementById('live');
  if (el) el.classList.toggle('on', on);
  const btn = document.querySelector('[data-act=live]');
  if (btn) btn.classList.toggle('on', on);
  if (flowGroup) flowGroup.visible = true;   // 由 liveAmt 控制透明度
  const st = document.getElementById('liveState');
  if (st){ st.textContent = on ? 'RUNNING' : 'STANDBY'; st.style.color = on ? 'var(--ok)' : 'var(--muted)'; }
}

/* ---- 每帧驱动 ---- */
function updateLive(dt){
  liveAmt += ((liveOn ? 1 : 0) - liveAmt) * Math.min(1, dt * 4.2);
  liveT += dt;
  const A = liveAmt;
  if (flowGroup) flowGroup.visible = A > 0.004;

  flowMats.forEach(f => {
    f.tex.offset.x -= f.speed * dt;
    f.mat.opacity = A * (0.40 + 0.26 * Math.sin(liveT * 2.4 + f.off));
  });
  glowMats.forEach(g => {
    const s = 0.62 + 0.38 * Math.sin(liveT * (g.pole ? 1.6 : 2.1) + g.off);
    g.m.emissiveIntensity = A * g.base * s;
  });
  lampMats.forEach(l => {
    const blink = l.sp > 2.3 ? (Math.sin(liveT * l.sp + l.off) > 0.3 ? 1 : 0.12)   // 快闪=报警位
                              : (0.62 + 0.38 * Math.sin(liveT * l.sp + l.off));
    l.m.emissiveIntensity = A > 0.02 ? l.base * blink * A : l.base * 0.35;
  });

  hudT += dt;
  if (hudT > 0.28 && A > 0.02) { hudT = 0; updateHud(); }
}

const $ = id => document.getElementById(id);
function updateHud(){
  const j = (v, d) => v + (Math.random() - 0.5) * d;
  const t = liveT;
  if ($('vBus'))   $('vBus').textContent   = j(10.02, 0.05).toFixed(2) + ' kV';
  if ($('vBusLv')) $('vBusLv').textContent = j(400.6, 1.1).toFixed(1) + ' V';
  if ($('pAct'))   $('pAct').textContent   = j(386.4, 7).toFixed(1) + ' kW';
  if ($('pPf'))    $('pPf').textContent    = j(0.94, 0.008).toFixed(2);
  const base = 0.60 + 0.06 * Math.sin(t * 0.55);
  const bar = $('loadBar');
  if (bar) bar.style.width = Math.round(base * 100) + '%';
  if ($('loadTxt')) $('loadTxt').textContent = Math.round(base * 100) + '%';
  ['phA','phB','phC'].forEach((id, i) => {
    const el = $(id); if (!el) return;
    const cur = j(428 - i * 6, 14);
    const h = Math.min(100, cur / 520 * 100);
    const s = el.querySelector('s');
    if (s) s.style.height = h.toFixed(0) + '%';
    el.setAttribute('data-p', PHASE[i].nm + ' ' + Math.round(cur) + 'A');
  });
  if ($('liveClock')) $('liveClock').textContent = new Date().toLocaleTimeString('zh-CN', {hour12:false});
}


/* ---------- 门开合: 绕右侧铰链轴(世界 Y)刚性旋转 ----------
   实测: Blender 建模姿态下门板相对铰链为 77°(从柜前脸起算)。
   人为定义两个目标姿态, 绕世界 Y 轴增量旋转:
     open=1 → 门转到 90°(与柜前脸垂直, 工程图姿态)
     open=0 → 门转到 0°(完全关闭, 贴住柜前脸)
   门做半透明处理, 开门时不会遮挡柜内元件。
------------------------------------------------------------------- */
let doorParts = [];
// 铰链轴 (运行时从门板几何反推, three.js 世界坐标 xz 平面)
const HINGE = { x: -0.9088, z: 0.1323 };
let DOOR_W = 0.75;                        // 门宽(米)
const DOOR_BASE_DEG = 77;                 // 模型原始姿态角
const DOOR_OPEN_DEG = 90;                 // 全开角
const DOOR_SHUT_DEG = 0;                  // 全关角

function collectDoorParts(root){
  // 收集门的全部网格部件(门板 + 门内附件)
  doorParts = [];
  root.traverse(o => {
    if (o.isMesh && /^hv_(door$|drib|adbox|adcap|dvent|dhd)/.test(o.name)) {
      const wp = new THREE.Vector3(); o.getWorldPosition(wp);
      doorParts.push({o, world0: wp.clone()});
    }
  });
  // 用门板几何反推铰链: 铰链 = 门中心 - 门宽方向 * (门宽/2)
  let dm = null;
  root.traverse(o => { if (!dm && o.isMesh && o.name === 'hv_door') dm = o; });
  if (dm){
    dm.geometry.computeBoundingBox();
    const bb = dm.geometry.boundingBox;
    const xax = new THREE.Vector3(1, 0, 0).transformDirection(dm.matrixWorld);
    DOOR_W = Math.abs(bb.max.x - bb.min.x);
    const ctr = new THREE.Vector3(); dm.getWorldPosition(ctr);
    HINGE.x = ctr.x - xax.x * (DOOR_W / 2);
    HINGE.z = ctr.z - xax.z * (DOOR_W / 2);
    console.log('[twin] hinge =', HINGE.x.toFixed(4), HINGE.z.toFixed(4),
                '| doorW =', DOOR_W.toFixed(3), '| parts =', doorParts.length);
  }
}

function applyDoor(open, explode){
  // 目标姿态角: open=1 → 90°, open=0 → 0°
  const targetDeg = DOOR_SHUT_DEG + open * (DOOR_OPEN_DEG - DOOR_SHUT_DEG);
  const extra = THREE.MathUtils.degToRad(targetDeg - DOOR_BASE_DEG);  // 相对原始姿态的增量
  const cos = Math.cos(extra), sin = Math.sin(extra);
  doorParts.forEach(d => {
    const w0 = d.world0;
    const dx = w0.x - HINGE.x, dz = w0.z - HINGE.z;
    const wx = HINGE.x + dx * cos + dz * sin;
    const wz = HINGE.z - dx * sin + dz * cos;
    // 分解位移仅作用在 y 方向(避免门飞出画面)
    const dir = d.o.userData.explodeDir, mag = d.o.userData.explodeMag || 0;
    const ey = (dir && explode) ? dir.y * mag * explode : 0;
    d.o.position.set(
      d.o.userData.doorBase.x + (wx - w0.x),
      d.o.userData.doorBase.y + ey,
      d.o.userData.doorBase.z + (wz - w0.z)
    );
  });
}

/* ---------- 门做半透明: 既保留"开门"结构信息, 又不遮挡柜内元件 ---------- */
function makeDoorTranslucent(){
  doorParts.forEach(d => {
    const m = d.o.material;
    if (!m) return;
    const set = mm => {
      mm.transparent = true;
      mm.opacity = 0.46;          // 保留一定实体感, 不是全透明
      mm.depthWrite = true;       // ⚠️ 必须保留, 否则渲染顺序错乱变成"幽灵板"
      mm.side = THREE.DoubleSide;
      mm.needsUpdate = true;
    };
    Array.isArray(m) ? m.forEach(set) : set(m);
  });
  console.log('[twin] translucent doors:', doorParts.length);
}

/* ==================== 主题切换 ==================== */
function applyTheme(name){
  themeName = name;
  const t = THEMES[name];
  document.body.classList.toggle('light', name === 'light');
  scene.background.setHex(t.bg);
  scene.fog.color.setHex(t.bg);
  scene.fog.near = t.fogNear; scene.fog.far = t.fogFar;
  ground.material.color.setHex(t.ground);
  ground.material.roughness = t.groundRough;
  ground.material.metalness = t.groundMetal;
  scene.remove(grid);
  grid.geometry.dispose();
  const ng = new THREE.GridHelper(28, 56, t.grid, t.grid2);
  ng.position.y = 0.002; ng.material.transparent = true; ng.material.opacity = t.gridOpacity;
  scene.add(ng); grid = ng;
  hemi.color.setHex(t.hemiSky); hemi.groundColor.setHex(t.hemiGround); hemi.intensity = t.hemi;
  key.color.setHex(t.key);   key.intensity  = t.keyI;
  fill.color.setHex(t.fill); fill.intensity = t.fillI;
  rim.color.setHex(t.rim);   rim.intensity  = t.rimI;
  top.intensity = t.topI;
  renderer.toneMappingExposure = t.exposure;
  // 浅色下适当提高环境反射, 让白色柜体不至于"糊成一片"
  const envI = name === 'light' ? 1.05 : 0.75;
  if (window.__root) window.__root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach(mm => { if (mm && mm.envMapIntensity !== undefined) mm.envMapIntensity = envI; });
  });
  const lbl = document.getElementById('themeLbl');
  if (lbl) lbl.textContent = name === 'dark' ? '工程图' : '科技风';
  // 同步标注/引线配色
  if (typeof retintLabels === 'function') retintLabels(name);
}

/* ==================== 交互: 点击选元件 ==================== */
const ray = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downXY = null;

const cvs = renderer.domElement;
// 用捕获阶段监听, 避免被 OrbitControls 的默认处理干扰
cvs.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; }, true);
cvs.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]);
  downXY = null;
  if (moved > 6) return;                    // 拖拽不算点击
  if (state.labelsVisible) return;          // 标注模式下不干扰
  const r = cvs.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  ray.setFromCamera(pointer, camera);
  const hits = ray.intersectObjects(state.selectable, false);
  window.__lastHits = hits.length;
  if (!hits.length) { hideInfo(); return; }
  for (const h of hits.slice(0, 10)){
    if (matchKB(h.object)) { selectPart(h.object); return; }
  }
  selectPart(hits[0].object);
}, true);

function matchKB(obj){
  let n = obj;
  while (n && n !== window.__root){
    const nm = n.name || '';
    if (KB.some(k => nm.includes(k.k))) return KB.find(k => nm.includes(k.k));
    n = n.parent;
  }
  return null;
}

function hideInfo(){
  document.getElementById('info').classList.remove('show');
  if (state.highlightGroup){
    state.highlightGroup.forEach(o => {
      if (o.material && o.material.emissive){
        o.material.emissive.setHex(0x000000);
        o.material.emissiveIntensity = 0;
      }
    });
    state.highlightGroup = null;
  }
}

function selectPart(obj){
  // 清上一个高亮
  if (state.highlightGroup){
    state.highlightGroup.forEach(o => {
      if (o.material && o.material.emissive){
        o.material.emissive.setHex(0x000000);
        o.material.emissiveIntensity = 0;
      }
    });
    state.highlightGroup = null;
  }
  // 逐级向上找知识库条目
  let node = obj, info = null;
  while (node && !info){
    const nm = node.name || '';
    info = KB.find(k => nm.includes(k.k));
    if (info) break;
    node = node.parent;
    if (node === window.__root) break;
  }
  if (!info) { hideInfo(); return; }

  // 高亮同名组(整排元件一起亮), 上限防爆
  const group = [];
  window.__root.traverse(o => {
    if (o.isMesh && (o.name||'').includes(info.k)) group.push(o);
  });
  const list = (group.length > 1 && group.length <= 60) ? group : [obj];
  list.forEach(o => {
    if (!o.material) return;
    if (o.material.emissive === undefined) return;
    o.material = o.material.clone();
    o.material.emissive = new THREE.Color(0x0b6df6);
    o.material.emissiveIntensity = 0.34;
  });
  state.highlightGroup = list;
  state.highlightName = info.name;

  // 填充信息卡
  document.getElementById('iCat').textContent = info.cat;
  document.getElementById('iName').textContent = info.name;
  document.getElementById('iEn').textContent = info.en;
  document.getElementById('iKv').innerHTML = info.kv.map(([k,v]) =>
    `<div class="kv"><span class="k">${k}</span><span class="v mono">${v}</span></div>`).join('');
  document.getElementById('iDesc').textContent = info.desc;
  document.getElementById('iTags').innerHTML = info.tags.map(t =>
    `<span class="tg">${t}</span>`).join('');
  document.getElementById('info').classList.add('show');
}

    if (a === 'side'){  flyTo(new THREE.Vector3(5.0,1.5,0.05), new THREE.Vector3(0,1.15,0)); }

      if (!document.fullscreenElement) document.documentElement.requestFullscreen();

function toggleLabels(v){
  state.labelsVisible = v;
  state.labels.forEach(l => {
    l.el.style.opacity = v ? '1' : '0';
    l.visible = v;
    if (l.line) l.line.visible = v;
    if (l.dot)  l.dot.visible  = v;
  });
  // 引线默认隐式创建为 visible=false, 首次开启时补亮
  if (v) state.labels.forEach(l => { if (l.line) l.line.visible = true; if (l.dot) l.dot.visible = true; });
}
function toggleFlow(){ setLive(!liveOn); }

/* ==================== 底部按钮 ==================== */
document.querySelectorAll('.dbtn').forEach(b => {
  b.addEventListener('click', () => {
    const a = b.dataset.act;

      setLive(!liveOn);
    }
    if (a === 'hv' || a === 'lv' || a === 'all'){
      document.querySelectorAll('.dbtn[data-act=hv],.dbtn[data-act=lv],.dbtn[data-act=all]')
        .forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      state.focus = a;
      if (a === 'hv') flyTo(new THREE.Vector3(-0.62,1.35,2.95), new THREE.Vector3(-0.62,1.15,0));
      if (a === 'lv') flyTo(new THREE.Vector3(1.12,1.35,2.95), new THREE.Vector3(0.62,1.15,0));
      if (a === 'all') flyTo(new THREE.Vector3(0.95,1.75,4.35), new THREE.Vector3(0,1.15,0));
    }
  });
});

document.getElementById('exRange').addEventListener('input', e => {
  const v = +e.target.value / 100;
  state.explodeTarget = v;
  document.querySelector('[data-act=explode]').classList.toggle('on', v > 0.02);
});

let doorPivot = null;
function applyCutaway(on){
  // 剖切: 隐藏低压柜侧板/顶板, 突出内部结构
  window.__root.traverse(o => {
    if (!o.isMesh) return;
    const n = o.name || '';
    const isShellPiece = /^(lv|hv)_(sideL|sideR|top$|topcap|back)$/.test(n);
    if (isShellPiece) o.visible = !on;
  });
}

/* ==================== 飞行相机 ==================== */
let fly = null;
function flyTo(pos, tgt){
  fly = { p0:camera.position.clone(), p1:pos.clone(),
          t0:controls.target.clone(), t1:tgt.clone(), k:0 };
}

/* ==================== 循环 ==================== */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // 相机飞行
  if (fly){
    fly.k = Math.min(1, fly.k + dt * 1.5);
    const e = 1 - Math.pow(1 - fly.k, 3);
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.t0, fly.t1, e);
    if (fly.k >= 1) fly = null;
  }

  // ---- 分解 & 门 统一驱动 ----
  if (state.explode !== state.explodeTarget){
    const step = Math.max(0.006, dt * 1.4);
    if (Math.abs(state.explodeTarget - state.explode) <= step) state.explode = state.explodeTarget;
    else state.explode += Math.sign(state.explodeTarget - state.explode) * step;
    state._dirty = true;
  }
  if (state.doorOpen !== state.doorTarget){
    const step = Math.max(0.008, dt * 1.5);
    if (Math.abs(state.doorTarget - state.doorOpen) <= step) state.doorOpen = state.doorTarget;
    else state.doorOpen += Math.sign(state.doorTarget - state.doorOpen) * step;
    state._dirty = true;
  }
  if (state._dirty){
    const doorSet = new Set(doorParts.map(d => d.o));
    const ex = state.explode;
    state.selectable.forEach(o => {
      if (doorSet.has(o)) return;
      const d = o.userData.explodeDir, m = o.userData.explodeMag, b = o.userData.basePos;
      if (!d || !b) return;
      o.position.set(b.x + d.x*m*ex, b.y + d.y*m*ex, b.z + d.z*m*ex);
    });
    applyDoor(state.doorOpen, ex);
    if (state.explode === state.explodeTarget && state.doorOpen === state.doorTarget) state._dirty = false;
  }

  // 运行状态: 电流流动 / 导线带电 / 指示灯
  updateLive(dt);

  // 标注引线跟随投影
  if (state.labelsVisible){
    state.labels.forEach(l => {
      tmpV.copy(l.anchor).project(camera);
      const x = (tmpV.x*0.5+0.5)*innerWidth, y = (-tmpV.y*0.5+0.5)*innerHeight;
      l.el.style.left = x + 'px'; l.el.style.top = y + 'px';
      l.el.style.opacity = (tmpV.z > 1) ? '0' : '1';
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// 调试探针(仅用于验证, 不影响交互)
window.__THREE = THREE; window.__state = state;
window.__cam = camera; window.__controls = controls;
window.__lookAt = (px, py, pz, tx, ty, tz) => {
  camera.position.set(px, py, pz);
  controls.target.set(tx, ty, tz);
  controls.update();
};
window.__liveInfo = () => ({
  on: liveOn, amt: +liveAmt.toFixed(3), belts: flowMats.length,
  wireMats: glowMats.length, lamps: lampMats.length,
  firstOpacity: flowMats[0] ? +flowMats[0].mat.opacity.toFixed(3) : null,
  firstOffsetX: flowMats[0] ? +flowMats[0].tex.offset.x.toFixed(4) : null,
});
Object.defineProperty(window, '__doorParts', { get: () => doorParts });
window.__probe = (cx, cy) => {
  const r = cvs.getBoundingClientRect();
  const v = new THREE.Vector2(((cx - r.left)/r.width)*2-1, -((cy - r.top)/r.height)*2+1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(v, camera);
  const hits = rc.intersectObjects(state.selectable, false);
  return hits.slice(0,3).map(h => h.object.name);
};

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 键盘快捷键
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') flyTo(new THREE.Vector3(0.95,1.75,4.35), new THREE.Vector3(0,1.15,0));
  if (e.key === 'e' || e.key === 'E') document.querySelector('[data-act=explode]').click();
  if (e.key === 'Escape') hideInfo();
});
</script>
